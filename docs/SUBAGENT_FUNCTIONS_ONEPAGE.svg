<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061537"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 58px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #dbeafe; letter-spacing: 0; }
      .section { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 30px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .cardTitle { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 24px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .text { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #475569; letter-spacing: 0; }
      .tiny { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 0; }
      .white { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 19px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .whiteSmall { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #e0f2fe; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #dbe4f0; stroke-width: 2; filter: url(#shadow); }
      .coreCard { fill: url(#core); stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .blue { fill: #2563eb; }
      .green { fill: #059669; }
      .red { fill: #dc2626; }
      .amber { fill: #d97706; }
      .purple { fill: #7c3aed; }
      .cyan { fill: #0891b2; }
      .slate { fill: #334155; }
      .pillText { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 13px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .line { stroke: #94a3b8; stroke-width: 3; fill: none; }
      .dash { stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="2100" class="bg"/>

  <rect x="70" y="55" width="1460" height="245" rx="34" fill="url(#header)" filter="url(#shadow)"/>
  <text x="120" y="150" class="title">서브에이전트 기능 한 장 요약</text>
  <text x="120" y="210" class="subtitle">운영 데이터를 자동으로 살피고, 위험을 분류하고, 필요한 화면/조치로 바로 연결합니다</text>
  <text x="120" y="262" class="whiteSmall">현재 앱 핵심: 시설 · 재고 · 안전 · 업무일지  /  확장형: 고객 · 예약 · 현장운영 · 콘텐츠 · 특수운영 · KPI</text>
  <circle cx="1370" cy="170" r="72" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <text x="1318" y="184" style="font-family: Pretendard, Arial, sans-serif; font-size: 44px; font-weight: 900; fill: #fff;">AI</text>
  <text x="1327" y="222" class="whiteSmall">HUB</text>

  <text x="90" y="385" class="section">1. AI 운영 허브</text>
  <rect x="90" y="425" width="1420" height="180" rx="28" class="card"/>
  <rect x="125" y="465" width="210" height="100" rx="20" fill="#0f172a"/>
  <text x="165" y="508" class="white">오케스트레이터</text>
  <text x="154" y="542" class="whiteSmall">전체 신호 통합</text>
  <text x="385" y="485" class="text">역할: 데이터 라우팅 · 권한 체크 · 추천 조치 생성 · 활동 기록 · KPI 집계</text>
  <text x="385" y="525" class="text">사용법: 상단 `서브에이전트` 버튼 → 추천 조치 확인 → 이동 또는 과제 등록</text>
  <text x="385" y="565" class="text">자동 감시: 켜면 추천 조치 수가 상단 배지로 표시되고, 끄면 필요할 때만 수동 확인</text>

  <text x="90" y="680" class="section">2. 현재 앱에 연결된 핵심 서브에이전트</text>

  <rect x="90" y="725" width="690" height="300" rx="26" class="coreCard"/>
  <circle cx="145" cy="790" r="34" class="blue"/>
  <text x="127" y="803" style="font-family: Arial, sans-serif; font-size: 34px; fill:#fff;">🛠</text>
  <text x="205" y="785" class="cardTitle">시설 에이전트</text>
  <rect x="205" y="808" width="110" height="28" rx="14" class="blue"/>
  <text x="232" y="827" class="pillText">실제 연결</text>
  <text x="125" y="880" class="text">확인: 미완료 보완과제 · 긴급 과제 · 기한초과 · 사고 후속 점검</text>
  <text x="125" y="920" class="text">실행: 시설점검 화면 이동 · 보완과제 자동 등록 · 활동 기록 저장</text>
  <text x="125" y="960" class="tiny">예시: “기한 초과 보완과제 2건”, “사고 구역 후속 점검 필요”</text>

  <rect x="820" y="725" width="690" height="300" rx="26" class="coreCard"/>
  <circle cx="875" cy="790" r="34" class="green"/>
  <text x="856" y="803" style="font-family: Arial, sans-serif; font-size: 34px; fill:#fff;">📦</text>
  <text x="935" y="785" class="cardTitle">재고 에이전트</text>
  <rect x="935" y="808" width="110" height="28" rx="14" class="green"/>
  <text x="962" y="827" class="pillText">실제 연결</text>
  <text x="855" y="880" class="text">확인: 최소수량 이하 · 수량 0개 · 진행 중 요청서 · 입고 필요</text>
  <text x="855" y="920" class="text">실행: 재고관리 화면 이동 · 부족 품목 후속 조치 등록</text>
  <text x="855" y="960" class="tiny">예시: “교구 재고 부족”, “진행 중 요청서 확인 필요”</text>

  <rect x="90" y="1065" width="690" height="300" rx="26" class="coreCard"/>
  <circle cx="145" cy="1130" r="34" class="red"/>
  <text x="127" y="1143" style="font-family: Arial, sans-serif; font-size: 34px; fill:#fff;">🛡</text>
  <text x="205" y="1125" class="cardTitle">안전 에이전트</text>
  <rect x="205" y="1148" width="110" height="28" rx="14" class="red"/>
  <text x="232" y="1167" class="pillText">실제 연결</text>
  <text x="125" y="1220" class="text">확인: 사고/아차사고 · 일일 점검 · 안전 AI 분석 · 후속 조치 누락</text>
  <text x="125" y="1260" class="text">실행: 안전관리 화면 이동 · 사고 후속 점검 과제 등록</text>
  <text x="125" y="1300" class="tiny">예시: “오늘 안전 점검 없음”, “사고 후속 조치 필요”</text>

  <rect x="820" y="1065" width="690" height="300" rx="26" class="coreCard"/>
  <circle cx="875" cy="1130" r="34" class="amber"/>
  <text x="856" y="1143" style="font-family: Arial, sans-serif; font-size: 34px; fill:#fff;">📒</text>
  <text x="935" y="1125" class="cardTitle">업무일지 에이전트</text>
  <rect x="935" y="1148" width="110" height="28" rx="14" class="amber"/>
  <text x="962" y="1167" class="pillText">실제 연결</text>
  <text x="855" y="1220" class="text">확인: 오늘 업무일지 작성 여부 · 저장 기록 · 조치 후 기록 누락</text>
  <text x="855" y="1260" class="text">실행: 통합 업무일지 화면 이동 · 일간 점검표 저장 유도</text>
  <text x="855" y="1300" class="tiny">예시: “오늘 업무일지 미작성”, “조치 후 기록 필요”</text>

  <text x="90" y="1445" class="section">3. 확장형 서브에이전트</text>

  <rect x="90" y="1490" width="445" height="180" rx="22" class="card"/>
  <circle cx="130" cy="1535" r="24" class="red"/>
  <text x="168" y="1544" class="cardTitle">고객·마케팅</text>
  <text x="120" y="1595" class="text">문의 · 민원 · 리뷰 · CRM · 캠페인</text>
  <text x="120" y="1630" class="tiny">반복 불만, 리뷰 악화, 홍보 필요 감지</text>

  <rect x="580" y="1490" width="445" height="180" rx="22" class="card"/>
  <circle cx="620" cy="1535" r="24" class="amber"/>
  <text x="658" y="1544" class="cardTitle">영업·예약·정산</text>
  <text x="610" y="1595" class="text">예약 · 티켓 · 결제 · 환불 · 매출</text>
  <text x="610" y="1630" class="tiny">단체 예약 증가, 정산 누락, 환불 지연 감지</text>

  <rect x="1070" y="1490" width="440" height="180" rx="22" class="card"/>
  <circle cx="1110" cy="1535" r="24" class="green"/>
  <text x="1148" y="1544" class="cardTitle">현장운영·CS</text>
  <text x="1100" y="1595" class="text">혼잡도 · 대기시간 · 업무배정 · 민원</text>
  <text x="1100" y="1630" class="tiny">현장 병목, 인력 부족, 민원 지연 감지</text>

  <rect x="90" y="1710" width="445" height="180" rx="22" class="card"/>
  <circle cx="130" cy="1755" r="24" class="purple"/>
  <text x="168" y="1764" class="cardTitle">콘텐츠·공연·교육</text>
  <text x="120" y="1815" class="text">행사 · 체험 · 해설 · MD · 교육자료</text>
  <text x="120" y="1850" class="tiny">준비물 부족, 안내문 필요, 교육 일정 감지</text>

  <rect x="580" y="1710" width="445" height="180" rx="22" class="card"/>
  <circle cx="620" cy="1755" r="24" class="cyan"/>
  <text x="658" y="1764" class="cardTitle">생물·수질·특수운영</text>
  <text x="610" y="1815" class="text">사육일지 · 급이 · 수질 · 검역</text>
  <text x="610" y="1850" class="tiny">수질 이상, 급이 누락, 건강 기록 감지</text>

  <rect x="1070" y="1710" width="440" height="180" rx="22" class="card"/>
  <circle cx="1110" cy="1755" r="24" class="slate"/>
  <text x="1148" y="1764" class="cardTitle">KPI·리포트</text>
  <text x="1100" y="1815" class="text">방문객 · 사고 · 매출 · 만족도 · 재고</text>
  <text x="1100" y="1850" class="tiny">대표/관리자용 운영 지표 자동 요약</text>

  <text x="90" y="1970" class="section">4. 뉴럴링크 흐름 예시</text>
  <rect x="90" y="2010" width="1420" height="64" rx="20" fill="#0f172a"/>
  <text x="135" y="2051" class="whiteSmall">안전 사고 감지 → 시설 보완과제 생성 → 업무일지 기록 요청 → KPI 사고 건수 반영 → 관리자 긴급 추천 표시</text>
</svg>
