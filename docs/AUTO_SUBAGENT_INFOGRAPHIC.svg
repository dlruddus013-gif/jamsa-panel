<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 56px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #dbeafe; letter-spacing: 0; }
      .label { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 22px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .small { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #475569; letter-spacing: 0; }
      .tiny { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 0; }
      .whiteSmall { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #e0f2fe; letter-spacing: 0; }
      .stepNo { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; filter: url(#shadow); }
      .panel { fill: url(#soft); stroke: #dbeafe; stroke-width: 2; }
      .line { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      .arrow { fill: #94a3b8; }
      .green { fill: #059669; }
      .blue { fill: #2563eb; }
      .red { fill: #dc2626; }
      .amber { fill: #d97706; }
      .purple { fill: #7c3aed; }
      .slate { fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1900"/>

  <rect x="70" y="60" width="1260" height="280" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="120" y="160" class="title">자동 서브에이전트 운영 프레임워크</text>
  <text x="120" y="215" class="subtitle">시설 · 재고 · 안전 · 업무일지를 한 화면에서 감시하고 바로 실행합니다</text>
  <text x="120" y="280" class="whiteSmall">상단 메뉴의 “서브에이전트” 버튼 → 위험 요약 → 추천 조치 → 이동 또는 과제 등록</text>
  <rect x="1065" y="118" width="190" height="150" rx="24" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <text x="1116" y="182" style="font-family: Pretendard, 'Noto Sans KR', Arial, sans-serif; font-size: 62px; font-weight: 900; fill: #ffffff;">AI</text>
  <text x="1103" y="224" class="whiteSmall">관제센터</text>

  <text x="90" y="430" class="label">1. 작동 구조</text>

  <rect x="90" y="470" width="260" height="180" rx="20" class="card"/>
  <circle cx="130" cy="515" r="22" class="blue"/>
  <text x="122" y="522" class="stepNo">1</text>
  <text x="165" y="523" class="label">자동 수집</text>
  <text x="120" y="570" class="small">시설 보완과제</text>
  <text x="120" y="602" class="small">재고 수량/요청서</text>
  <text x="120" y="634" class="small">안전 사고/점검</text>

  <line x1="360" y1="560" x2="430" y2="560" class="line"/>
  <polygon points="430,560 410,548 410,572" class="arrow"/>

  <rect x="450" y="470" width="260" height="180" rx="20" class="card"/>
  <circle cx="490" cy="515" r="22" class="purple"/>
  <text x="482" y="522" class="stepNo">2</text>
  <text x="525" y="523" class="label">에이전트 분석</text>
  <text x="480" y="570" class="small">시설 · 재고</text>
  <text x="480" y="602" class="small">안전 · 업무일지</text>
  <text x="480" y="634" class="small">상태 자동 판정</text>

  <line x1="720" y1="560" x2="790" y2="560" class="line"/>
  <polygon points="790,560 770,548 770,572" class="arrow"/>

  <rect x="810" y="470" width="260" height="180" rx="20" class="card"/>
  <circle cx="850" cy="515" r="22" class="amber"/>
  <text x="842" y="522" class="stepNo">3</text>
  <text x="885" y="523" class="label">위험도 분류</text>
  <text x="840" y="570" class="small">정상</text>
  <text x="840" y="602" class="small">관찰 필요</text>
  <text x="840" y="634" class="small">긴급 조치</text>

  <line x1="1080" y1="560" x2="1150" y2="560" class="line"/>
  <polygon points="1150,560 1130,548 1130,572" class="arrow"/>

  <rect x="1170" y="470" width="140" height="180" rx="20" class="card"/>
  <circle cx="1210" cy="515" r="22" class="green"/>
  <text x="1202" y="522" class="stepNo">4</text>
  <text x="1204" y="565" class="label">실행</text>
  <text x="1200" y="608" class="small">이동</text>
  <text x="1200" y="640" class="small">등록</text>

  <text x="90" y="730" class="label">2. 네 명의 서브에이전트</text>

  <rect x="90" y="780" width="580" height="250" rx="24" class="panel"/>
  <rect x="115" y="810" width="88" height="88" rx="20" fill="#dbeafe"/>
  <text x="134" y="867" style="font-family: Arial, sans-serif; font-size: 42px;">🛠</text>
  <text x="230" y="840" class="label">시설 에이전트</text>
  <text x="230" y="885" class="small">미완료 · 긴급 · 기한초과 보완과제를 확인</text>
  <text x="230" y="928" class="tiny">실행: 시설점검 이동 / 보완과제 등록</text>
  <rect x="230" y="955" width="120" height="34" rx="17" fill="#dbeafe"/>
  <text x="258" y="978" class="tiny" fill="#1d4ed8">시설</text>

  <rect x="730" y="780" width="580" height="250" rx="24" class="panel"/>
  <rect x="755" y="810" width="88" height="88" rx="20" fill="#dcfce7"/>
  <text x="774" y="867" style="font-family: Arial, sans-serif; font-size: 42px;">📦</text>
  <text x="870" y="840" class="label">재고 에이전트</text>
  <text x="870" y="885" class="small">최소수량 이하 품목과 진행 요청서를 확인</text>
  <text x="870" y="928" class="tiny">실행: 재고관리 이동 / 발주·입고 확인</text>
  <rect x="870" y="955" width="120" height="34" rx="17" fill="#dcfce7"/>
  <text x="898" y="978" class="tiny" fill="#166534">재고</text>

  <rect x="90" y="1070" width="580" height="250" rx="24" class="panel"/>
  <rect x="115" y="1100" width="88" height="88" rx="20" fill="#fee2e2"/>
  <text x="134" y="1157" style="font-family: Arial, sans-serif; font-size: 42px;">🛡</text>
  <text x="230" y="1130" class="label">안전 에이전트</text>
  <text x="230" y="1175" class="small">사고 기록 · 일일 점검 · AI 분석 이력 확인</text>
  <text x="230" y="1218" class="tiny">실행: 안전관리 이동 / 후속 점검 등록</text>
  <rect x="230" y="1245" width="120" height="34" rx="17" fill="#fee2e2"/>
  <text x="258" y="1268" class="tiny" fill="#991b1b">안전</text>

  <rect x="730" y="1070" width="580" height="250" rx="24" class="panel"/>
  <rect x="755" y="1100" width="88" height="88" rx="20" fill="#fef3c7"/>
  <text x="774" y="1157" style="font-family: Arial, sans-serif; font-size: 42px;">📒</text>
  <text x="870" y="1130" class="label">업무일지 에이전트</text>
  <text x="870" y="1175" class="small">오늘 업무일지 작성 여부를 확인</text>
  <text x="870" y="1218" class="tiny">실행: 통합 업무일지 이동 / 기록 저장</text>
  <rect x="870" y="1245" width="140" height="34" rx="17" fill="#fef3c7"/>
  <text x="898" y="1268" class="tiny" fill="#92400e">업무일지</text>

  <text x="90" y="1405" class="label">3. 위험도와 실행 버튼</text>

  <rect x="90" y="1450" width="380" height="180" rx="24" class="card"/>
  <circle cx="135" cy="1505" r="18" class="green"/>
  <text x="170" y="1514" class="label">정상</text>
  <text x="125" y="1565" class="small">추가 조치 없음</text>
  <text x="125" y="1600" class="tiny">상태만 확인하고 운영 계속</text>

  <rect x="510" y="1450" width="380" height="180" rx="24" class="card"/>
  <circle cx="555" cy="1505" r="18" class="amber"/>
  <text x="590" y="1514" class="label">관찰</text>
  <text x="545" y="1565" class="small">확인 또는 기록 보완</text>
  <text x="545" y="1600" class="tiny">관련 모듈로 이동해 상세 확인</text>

  <rect x="930" y="1450" width="380" height="180" rx="24" class="card"/>
  <circle cx="975" cy="1505" r="18" class="red"/>
  <text x="1010" y="1514" class="label">긴급</text>
  <text x="965" y="1565" class="small">즉시 조치 및 과제 등록</text>
  <text x="965" y="1600" class="tiny">담당자 확인 후 활동 기록 유지</text>

  <rect x="90" y="1695" width="1220" height="125" rx="26" fill="#0f172a" filter="url(#shadow)"/>
  <text x="130" y="1750" class="whiteSmall">교육용 한 줄 설명</text>
  <text x="130" y="1795" style="font-family: Pretendard, 'Noto Sans KR', Arial, sans-serif; font-size: 28px; font-weight: 900; fill: #ffffff;">“운영 데이터를 대신 훑어보고, 지금 확인해야 할 일을 한 화면에 모아주는 작은 관제 팀”</text>
</svg>
