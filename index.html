<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; font-src 'self' data: https:; frame-src 'self' https:;">
  <title>한국잠사박물관 통합관리 시스템</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='75' font-size='80' text-anchor='middle'%3E🏛️%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; background: #f5f5f5; overflow: hidden; }

    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; z-index: 9999; }
    #loading.hidden { display: none; }
    #loading .logo { font-size: 64px; }
    #loading .title { font-size: 18px; font-weight: 700; }
    #loading .sub { font-size: 12px; opacity: 0.6; }
    #loading .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-stack { position: fixed; bottom: 12px; right: 12px; z-index: 9000; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .status-pill { padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 600; background: rgba(15, 23, 42, 0.85); color: #fff; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .status-pill[data-state="online"] .dot, .status-pill[data-state="ok"] .dot, .status-pill[data-state="idle"] .dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-pill[data-state="offline"] .dot, .status-pill[data-state="error"] .dot { background: #ef4444; }
    .status-pill[data-state="pending"] .dot, .status-pill[data-state="syncing"] .dot { background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #globalSearch { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8500; width: 360px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: flex; align-items: center; padding: 4px 4px 4px 14px; transition: all 0.2s; }
    #globalSearch:focus-within { width: 480px; box-shadow: 0 6px 20px rgba(59,91,219,0.18); }
    #globalSearch input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; padding: 7px 0; color: #0f172a; font-family: inherit; }
    #globalSearch input::placeholder { color: #94a3b8; }
    #globalSearch .icon { width: 14px; height: 14px; opacity: 0.5; margin-right: 8px; }
    #globalSearch .shortcut { font-size: 10px; color: #64748b; padding: 2px 6px; background: rgba(0,0,0,0.05); border-radius: 4px; margin-right: 6px; font-family: ui-monospace, monospace; }

    #searchResults { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 9500; width: 540px; max-height: 60vh; overflow: auto; background: white; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); display: none; padding: 8px; pointer-events: auto; }
    #searchResults.active { display: block; pointer-events: auto; }
    .sr-row { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .sr-row:hover { background: #f1f5f9; }
    .sr-coll { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: #dbeafe; color: #1e40af; font-weight: 600; flex-shrink: 0; min-width: 80px; text-align: center; }
    .sr-preview { font-size: 13px; color: #0f172a; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sr-empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
    .sr-header { padding: 8px 12px; font-size: 11px; color: #64748b; font-weight: 600; border-bottom: 0.5px solid #e2e8f0; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🏛️</div>
    <div class="title">한국잠사박물관 통합관리 시스템</div>
    <div class="spinner"></div>
    <div class="sub" id="loadingMsg">시스템 초기화 중...</div>
  </div>

  <div id="globalSearch">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="재고/시설/조치/이력 전체 검색... (Ctrl+K)" autocomplete="off">
    <span class="shortcut">⌘K</span>
  </div>
  <div id="searchResults"></div>

  <div id="root"></div>

  <div class="status-stack">
    <div class="status-pill" id="authBadge" data-state="offline" title="인증 상태">
      <span class="dot"></span>
      <span class="auth-txt">🔓 미로그인</span>
    </div>
    <div class="status-pill" id="syncBadge" data-state="idle" title="클라우드 동기화">
      <span class="dot"></span>
      <span class="sync-txt">클라우드 ✓</span>
    </div>
    <div class="status-pill" id="backendBadge" data-state="offline" title="CCTV 5555 (옵션)" style="display:none;">
      <span class="dot"></span>
      <span id="backendStatus">CCTV 확인...</span>
    </div>
  </div>

  <script>
    (function() {
      const msgs = ['시스템 초기화 중...', '인증 확인...', '데이터 동기화...', '거의 완료...'];
      let i = 0;
      const msgEl = document.getElementById('loadingMsg');
      const interval = setInterval(() => {
        i = (i + 1) % msgs.length;
        if (msgEl && !msgEl.textContent.includes('완료') && !msgEl.textContent.includes('필요') && !msgEl.textContent.includes('실패')) {
          msgEl.textContent = msgs[i];
        }
      }, 700);
      window.__hideLoading = () => {
        clearInterval(interval);
        const el = document.getElementById('loading');
        if (el) {
          el.style.transition = 'opacity 0.3s';
          el.style.opacity = '0';
          setTimeout(() => el.classList.add('hidden'), 300);
        }
      };
    })();

    // CCTV 5555 백엔드 상태 (BACKEND_URL 설정된 경우만)
    setTimeout(() => {
      if (!window.BACKEND_URL) return;
      const badge = document.getElementById('backendBadge');
      const status = document.getElementById('backendStatus');
      badge.style.display = 'flex';
      const check = async () => {
        try {
          const res = await fetch(window.BACKEND_URL + '/api/status', { signal: AbortSignal.timeout?.(3000), mode: 'no-cors' });
          badge.dataset.state = 'online';
          status.textContent = 'CCTV ●';
        } catch (e) {
          badge.dataset.state = 'offline';
          status.textContent = 'CCTV 끊김';
        }
      };
      check();
      setInterval(check, 15000);
    }, 2000);

    // 글로벌 검색 + AI 작업 도우미 (Phase 2)
    (function() {
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');
      let timer = null;
      const HIST_KEY = 'jamsa_search_history';
      const ACTIONS_KEY = 'jamsa_recent_ai_actions';
      const MAX_HIST = 20;
      const LABELS = {
        'jamsa_inv_prods': '📦 재고', 'jamsa_inv_hist': '📜 이력',
        'jamsa_custom_zones': '📍 구역', 'jamsa_fac_inspections': '🛠 점검',
        'jamsa_fac_actions': '✓ 조치', 'jamsa_audit_log': '📋 활동',
        'jamsa_worklogs': '📒 일지',
      };
      const AI_CATEGORIES = [
        { id:'facility',    icon:'🗺️', label:'시설',   color:'#3b82f6', ex:'?수정고 어디 있어?' },
        { id:'inventory',   icon:'📦', label:'재고',   color:'#f59e0b', ex:'?재고 부족 품목 보여줘' },
        { id:'maintenance', icon:'🛠️', label:'점검',   color:'#10b981', ex:'?오늘 일일 점검 어떻게 해?' },
        { id:'emergency',   icon:'🚨', label:'긴급',   color:'#dc2626', ex:'?긴급상황 발생 시 순서 알려줘' },
        { id:'alert',       icon:'🔔', label:'알림',   color:'#a855f7', ex:'?텔레그램 알림 설정' },
        { id:'report',      icon:'📊', label:'보고서', color:'#0891b2', ex:'?오늘 운영 요약' },
      ];
      const QUICK_EXAMPLES = [
        '?오늘 운영 요약','?긴급 경고 확인','?재고 부족 확인',
        '?텔레그램 알림 설정','?보완과제 많은 시설','?캘린더 AI 자동 일정',
      ];
      const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { return []; } };
      const saveHistory = (q) => {
        if (!q || q.length < 2 || q.startsWith('?') || q.startsWith('/')) return;
        const cur = loadHistory().filter(x => x.q !== q);
        cur.unshift({ q, at: Date.now() });
        try { localStorage.setItem(HIST_KEY, JSON.stringify(cur.slice(0, MAX_HIST))); } catch (e) {}
      };
      const loadActions = () => { try { return JSON.parse(localStorage.getItem(ACTIONS_KEY) || '[]'); } catch (e) { return []; } };
      const saveAction = (label, type, payload) => {
        const cur = loadActions().filter(a => a.label !== label);
        cur.unshift({ label, type, payload, at: Date.now() });
        try { localStorage.setItem(ACTIONS_KEY, JSON.stringify(cur.slice(0, 10))); } catch (e) {}
      };
      const clearHistory = () => {
        if (!confirm('최근 검색/작업 기록을 모두 삭제할까요?')) return;
        try { localStorage.removeItem(HIST_KEY); localStorage.removeItem(ACTIONS_KEY); renderEmpty(); } catch (e) {}
      };
      window.__clearSearchHistory = clearHistory;
      const timeAgo = (ts) => {
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return s + '초 전';
        if (s < 3600) return Math.floor(s/60) + '분 전';
        if (s < 86400) return Math.floor(s/3600) + '시간 전';
        return Math.floor(s/86400) + '일 전';
      };
      window.__execAiAction = (idx) => {
        const a = window.__lastAiActions?.[idx];
        if (!a) return;
        const { label, type, payload = {} } = a;
        saveAction(label, type, payload);
        results.classList.remove('active');
        input.value = '';
        if (type === 'external_link' && payload.url) {
          window.open(payload.url, '_blank', 'noopener');
        } else {
          window.dispatchEvent(new CustomEvent('jamsa-ai-action', { detail: { type, payload, label, requiresConfirmation: a.requiresConfirmation } }));
        }
      };
      window.__rerun = (q) => { input.value = q; input.focus(); search(q); };
      window.__askChatbot = () => {
        if (input.value && !input.value.startsWith('?') && !input.value.startsWith('/')) {
          input.value = '?' + input.value;
        } else if (!input.value) {
          input.value = '?';
        }
        input.focus();
        const p = input.value.length;
        input.setSelectionRange(p, p);
      };
      const renderEmpty = () => {
        const hist = loadHistory();
        const actions = loadActions();
        let html = '<div class="sr-header" style="display:flex;justify-content:space-between;align-items:center"><span>🤖 AI 작업 도우미</span><span style="font-size:9px;color:#94a3b8">무엇을 도와드릴까요?</span></div>';
        html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 4px">';
        AI_CATEGORIES.forEach(c => {
          html += '<button onclick="window.__rerun(\'' + c.ex.replace(/'/g,"\\'") + '\')"';
          html += ' style="padding:10px 6px;border-radius:8px;border:1px solid ' + c.color + '33;background:' + c.color + '10;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px"';
          html += ' onmouseover="this.style.background=\'' + c.color + '25\'" onmouseout="this.style.background=\'' + c.color + '10\'">';
          html += '<span style="font-size:20px">' + c.icon + '</span>';
          html += '<span style="font-size:10px;font-weight:800;color:' + c.color + '">' + c.label + '</span>';
          html += '</button>';
        });
        html += '</div>';
        html += '<div class="sr-header" style="margin-top:4px">💡 추천 질문</div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px">';
        QUICK_EXAMPLES.forEach(q => {
          const safe = q.replace(/'/g, "\\'");
          html += '<button onclick="window.__rerun(\'' + safe + '\')" style="padding:4px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;cursor:pointer;font-size:11px;color:#475569;font-weight:600">' + q.replace(/^\?/, '') + '</button>';
        });
        html += '</div>';
        if (actions.length > 0) {
          html += '<div class="sr-header" style="margin-top:4px">⚡ 최근 작업 (' + actions.length + ')</div>';
          actions.slice(0,5).forEach((a,i) => {
            const safeLabel = a.label.replace(/</g, '&lt;');
            html += '<div class="sr-row" style="cursor:pointer" onclick="window.__lastAiActions=[' + JSON.stringify(a).replace(/"/g,'&quot;') + '];window.__execAiAction(0)">';
            html += '<span class="sr-coll" style="background:#eef2ff;color:#4338ca">⚡</span>';
            html += '<span class="sr-preview">' + safeLabel + ' <span style="color:#94a3b8;font-size:10px">· ' + timeAgo(a.at) + '</span></span>';
            html += '</div>';
          });
        }
        if (hist.length > 0) {
          html += '<div class="sr-header" style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">';
          html += '<span>📜 최근 검색 (' + hist.length + ')</span>';
          html += '<span style="cursor:pointer;color:#dc2626;font-size:10px;font-weight:bold" onclick="window.__clearSearchHistory()">🗑️ 전체삭제</span>';
          html += '</div>';
          hist.slice(0,6).forEach(h => {
            const safe = h.q.replace(/</g, '&lt;').replace(/'/g, '&#39;');
            html += '<div class="sr-row" style="cursor:pointer" onclick="window.__rerun(\'' + safe + '\')">';
            html += '<span class="sr-coll" style="background:#f1f5f9;color:#475569">📜</span>';
            html += '<span class="sr-preview">' + safe + ' <span style="color:#94a3b8;font-size:10px">· ' + timeAgo(h.at) + '</span></span>';
            html += '</div>';
          });
        }
        if (hist.length === 0 && actions.length === 0) {
          html += '<div style="padding:10px 12px;font-size:10px;color:#94a3b8;text-align:center">💡 카테고리를 선택하거나 추천 질문을 클릭하세요</div>';
        }
        results.innerHTML = html;
        results.classList.add('active');
      };
      const renderChatbotResponse = (question, data) => {
        const ans = (data.answer || '응답 없음').replace(/</g, '&lt;');
        const conf = data.confidence || 'medium';
        const confMeta = { high:{bg:'#dcfce7',color:'#15803d',label:'확실'}, medium:{bg:'#fef3c7',color:'#92400e',label:'보통'}, low:{bg:'#fee2e2',color:'#991b1b',label:'낮음'} }[conf] || { bg:'#f1f5f9',color:'#475569',label:conf };
        let src;
        if (data.source === 'claude') {
          const modelLabel = (data.model || 'claude').replace(/^claude-/, '').replace(/-\d{8}$/, '');
          src = '<span style="background:linear-gradient(90deg,#9333ea,#2563eb);color:#fff;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:bold">✨ Claude ' + modelLabel + '</span>';
        } else {
          src = '<span style="background:#f1f5f9;color:#475569;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">📋 룰 기반</span>';
        }
        const confBadge = '<span style="background:' + confMeta.bg + ';color:' + confMeta.color + ';padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">확실도 ' + confMeta.label + '</span>';
        let html = '<div class="sr-header" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><span>🤖 AI 답변</span><span style="display:flex;gap:4px">' + confBadge + ' ' + src + '</span></div>';
        html += '<div class="sr-row" style="flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;background:#f8fafc;border-radius:8px;margin:4px">';
        html += '<div style="font-size:10px;color:#94a3b8">질문: ' + question.replace(/</g, '&lt;') + '</div>';
        html += '<div style="font-size:13px;color:#0f172a;line-height:1.6;white-space:pre-wrap">' + ans + '</div>';
        if (data.data_source?.length > 0) {
          html += '<div style="font-size:9px;color:#94a3b8">📚 근거: ' + data.data_source.join(', ') + '</div>';
        }
        html += '</div>';
        if (data.actions?.length > 0) {
          window.__lastAiActions = data.actions;
          html += '<div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 8px">';
          data.actions.forEach((a, i) => {
            const safeLabel = (a.label || '').replace(/</g, '&lt;');
            const isDanger = a.requiresConfirmation;
            const bg = isDanger ? '#fef3c7' : '#dbeafe';
            const fg = isDanger ? '#92400e' : '#1e40af';
            const border = isDanger ? '#fbbf24' : '#60a5fa';
            const prefix = isDanger ? '⚠️ ' : '';
            html += '<button onclick="window.__execAiAction(' + i + ')" style="padding:6px 12px;background:' + bg + ';border:1px solid ' + border + ';color:' + fg + ';border-radius:14px;cursor:pointer;font-size:11px;font-weight:700">' + prefix + safeLabel + '</button>';
          });
          html += '</div>';
        }
        if (data.setup_hint) {
          html += '<div style="margin:6px 8px;padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;font-size:10px;color:#92400e;line-height:1.5">' + data.setup_hint.replace(/</g, '&lt;') + '</div>';
        }
        if (data.usage) {
          html += '<div style="padding:4px 12px;font-size:9px;color:#94a3b8;text-align:right">tokens: 입력 ' + (data.usage.input_tokens||0) + ' · 출력 ' + (data.usage.output_tokens||0) + '</div>';
        }
        html += '<div class="sr-row" style="cursor:pointer;justify-content:center" data-search-action="new-question" onclick="document.getElementById(\'searchInput\').value=\'\';document.getElementById(\'searchInput\').focus();">';
        html += '<span style="color:#3b82f6;font-size:11px;font-weight:bold">➕ 새로운 질문하기</span></div>';
        results.innerHTML = html;
      };
      const askChatbot = async (question) => {
        results.innerHTML = '<div class="sr-header">🤖 AI 작업 도우미</div><div class="sr-empty" style="padding:20px;text-align:center;color:#6366f1">⏳ Claude가 분석 중...</div>';
        results.classList.add('active');
        try {
          const fetcher = window.authFetch || ((p,o)=>fetch(p,o));
          const r = await fetcher('/api/chatbot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question,
              userRole: window.__jamsa_role || 'master',
              currentPage: window.__jamsa_current_page || '',
            }),
          });
          if (!r.ok) {
            const txt = await r.text().catch(()=>'');
            if (r.status === 404) {
              results.innerHTML = '<div class="sr-empty">⚠️ 챗봇 API 미배포 (404)<br/><br/>잠시 후 다시 시도하거나, 새로고침해주세요.</div>';
            } else if (r.status === 429) {
              results.innerHTML = '<div class="sr-empty">⏳ 너무 많은 요청 (429)<br/>1분 후 다시 시도해주세요.</div>';
            } else {
              results.innerHTML = '<div class="sr-empty">❌ AI 호출 실패: HTTP ' + r.status + '<br/><span style="font-size:10px;opacity:0.7">' + (txt.slice(0,150) || '서버 응답 없음').replace(/</g,'&lt;') + '</span></div>';
            }
            return;
          }
          const data = await r.json();
          renderChatbotResponse(question, data);
        } catch (e) {
          results.innerHTML = '<div class="sr-empty">❌ AI 호출 실패<br/><span style="font-size:10px;opacity:0.7">' + e.message + '</span><br/><br/>💡 네트워크 확인 또는 새로고침</div>';
        }
      };
      // 클라이언트 측 localStorage 직접 검색 (서버 검색 401 등 폴백용)
      const SEARCH_KEYS = Object.keys(LABELS);
      const clientSideSearch = (q, limit = 30) => {
        const lower = q.toLowerCase();
        const matches = [];
        for (const key of SEARCH_KEYS) {
          let arr;
          try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { continue; }
          if (!Array.isArray(arr)) continue;
          arr.forEach((item, idx) => {
            const text = JSON.stringify(item).toLowerCase();
            if (text.includes(lower)) {
              const preview = JSON.stringify(item).replace(/[{}"]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
              matches.push({ collection: key, index: idx, item, preview });
            }
          });
        }
        return matches.slice(0, limit);
      };
      const renderSearchMatches = (q, matches, mode) => {
        const grouped = {};
        matches.forEach(m => { (grouped[m.collection] = grouped[m.collection] || []).push(m); });
        const modeBadge = mode === 'client'
          ? '<span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">📱 로컬</span>'
          : '<span style="background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">☁ 서버</span>';
        let html = '<div class="sr-header" style="display:flex;justify-content:space-between;align-items:center"><span>' + matches.length + '건 ' + modeBadge + '</span><span data-search-action="ask-chatbot" style="color:#9333ea;font-size:10px;cursor:pointer;font-weight:bold" onclick="window.__askChatbot()">🤖 AI에게 물어보기</span></div>';
        for (const [coll, items] of Object.entries(grouped)) {
          const label = LABELS[coll] || coll.replace('jamsa_', '');
          items.slice(0, 6).forEach(m => {
            const e = (m.preview || '').replace(/</g, '&lt;');
            html += '<div class="sr-row" onclick="window.__openItem(\'' + coll + '\',' + m.index + ')"><span class="sr-coll">' + label + '</span><span class="sr-preview">' + e + '</span></div>';
          });
          if (items.length > 6) html += '<div class="sr-row" style="opacity:0.6"><span class="sr-coll">' + label + '</span><span class="sr-preview">...외 ' + (items.length - 6) + '건</span></div>';
        }
        results.innerHTML = html;
        results.classList.add('active');
      };

      const search = async (q) => {
        if (!q) { renderEmpty(); return; }
        if (q.startsWith('?') || q.startsWith('/')) {
          const question = q.slice(1).trim();
          if (!question) {
            results.innerHTML = '<div class="sr-empty">물음표 뒤에 질문을 입력하세요. 예: <strong>?재고 추가</strong></div>';
            results.classList.add('active');
            return;
          }
          askChatbot(question);
          return;
        }
        if (window.authFetch) {
          try {
            const res = await window.authFetch('/api/search?q=' + encodeURIComponent(q) + '&limit=30');
            if (res.ok) {
              const data = await res.json();
              const matches = data.matches || [];
              saveHistory(q);
              if (matches.length === 0) {
                results.innerHTML = '<div class="sr-empty">"' + q + '" 결과 없음 · 💡 AI에게 물어보려면 <strong style="color:#9333ea">?' + q + '</strong></div>';
                results.classList.add('active'); return;
              }
              renderSearchMatches(q, matches, 'server');
              return;
            }
          } catch (e) { /* fallthrough */ }
        }
        const matches = clientSideSearch(q, 30);
        saveHistory(q);
        if (matches.length === 0) {
          results.innerHTML = '<div class="sr-empty">"' + q + '" 결과 없음 (📱 로컬 검색)<br/><br/>💡 AI에게 물어보려면 <strong style="color:#9333ea">?' + q + '</strong></div>';
          results.classList.add('active'); return;
        }
        renderSearchMatches(q, matches, 'client');
      };
      window.__openItem = (coll, idx) => {
        results.classList.remove('active'); input.value = '';
        try {
          const data = JSON.parse(localStorage.getItem(coll) || '[]');
          const item = Array.isArray(data) ? data[idx] : data[idx];
          alert('[' + coll + ' #' + idx + ']\n\n' + JSON.stringify(item, null, 2).slice(0, 600));
        } catch (e) { alert(e.message); }
      };
      input.addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value.trim()), 200); });
      input.addEventListener('focus', () => { if (!input.value.trim()) renderEmpty(); });
      input.addEventListener('click', () => { if (!input.value.trim()) renderEmpty(); });
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { input.value = ''; results.classList.remove('active'); input.blur(); }
        if (e.key === 'Enter') { clearTimeout(timer); search(input.value.trim()); }
      });
      results.addEventListener('pointerdown', e => {
        const action = e.target.closest('[data-search-action]')?.dataset.searchAction;
        if (!action) return;
        e.preventDefault();
        e.stopPropagation();
        if (action === 'ask-chatbot') window.__askChatbot();
        if (action === 'new-question') { input.value = ''; input.focus(); renderEmpty(); }
      });
      results.addEventListener('click', e => {
        if (e.target.closest('[data-search-action]')) e.stopPropagation();
      });
      document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); input.focus(); input.select(); } });
      document.addEventListener('click', e => { if (!e.target.closest('#globalSearch') && !e.target.closest('#searchResults')) results.classList.remove('active'); });
    })();
  </script>
  <script type="module" src="/app.bundle.js?v=29370594"></script>
  <script>setTimeout(() => window.__hideLoading?.(), 1500);</script>
