<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="'Pretendard','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cloudBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="localBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="120" fill="url(#header)"/>
  <text x="600" y="55" text-anchor="middle" fill="#fff" font-size="32" font-weight="900">🔁 듀얼 브릿지 자동 폴백 매뉴얼</text>
  <text x="600" y="90" text-anchor="middle" fill="#e0f2fe" font-size="16">잠사박물관 CCTV — 클라우드 + 로컬 브릿지 동시 사용 + 자동 전환</text>
  <text x="600" y="110" text-anchor="middle" fill="#bae6fd" font-size="12">v2.0 · 2026-05-14</text>

  <!-- Section 1: 개요 -->
  <g transform="translate(40,150)">
    <rect width="1120" height="180" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#0f172a">📌 무엇이 바뀌었나요?</text>

    <g transform="translate(20,55)">
      <circle cx="14" cy="14" r="14" fill="#3b82f6"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">1</text>
      <text x="40" y="13" font-size="14" font-weight="800" fill="#0f172a">기본: 클라우드 브릿지 (cctv.thejamsa.com) — 박물관 PC 안 켜져 있어도 작동</text>
      <text x="40" y="32" font-size="12" fill="#475569">설치 불필요, 24/7 안정. 외부에서 접속 가능.</text>
    </g>

    <g transform="translate(20,100)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">2</text>
      <text x="40" y="13" font-size="14" font-weight="800" fill="#0f172a">선택: 로컬 브릿지 (http://localhost:5555) — 박물관 LAN에서 빠른 응답</text>
      <text x="40" y="32" font-size="12" fill="#475569">박물관 PC에 jamsa-cctv-bridge.cjs 실행. LAN 내부 사용 시 빠름.</text>
    </g>

    <g transform="translate(20,145)">
      <circle cx="14" cy="14" r="14" fill="#f59e0b"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">3</text>
      <text x="40" y="13" font-size="14" font-weight="800" fill="#0f172a">자동 폴백: 로컬 → 클라우드 순으로 시도. 하나가 꺼져도 자동 전환.</text>
      <text x="40" y="32" font-size="12" fill="#475569">사용자 개입 없이 끊김 없는 CCTV 스냅샷 표시.</text>
    </g>
  </g>

  <!-- Section 2: 아키텍처 다이어그램 -->
  <g transform="translate(40,360)">
    <rect width="1120" height="380" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#0f172a">🏗️ 동작 구조</text>

    <!-- Browser 박스 -->
    <g transform="translate(40,70)">
      <rect width="200" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
      <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="900" fill="#0f172a">🌐 잠사 패널</text>
      <text x="100" y="50" text-anchor="middle" font-size="11" fill="#475569">(브라우저)</text>
      <text x="100" y="68" text-anchor="middle" font-size="10" fill="#94a3b8">thejamsa.com</text>
    </g>

    <!-- 분기점 -->
    <g transform="translate(290,90)">
      <circle cx="30" cy="30" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
      <text x="30" y="27" text-anchor="middle" font-size="11" font-weight="900" fill="#92400e">자동</text>
      <text x="30" y="42" text-anchor="middle" font-size="11" font-weight="900" fill="#92400e">폴백</text>
    </g>

    <!-- 화살표: 브라우저 → 분기 -->
    <line x1="240" y1="110" x2="290" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <!-- 로컬 브릿지 (1순위) -->
    <g transform="translate(420,40)">
      <rect width="280" height="90" rx="10" fill="url(#localBg)" stroke="#10b981" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#065f46">🖥️ 로컬 브릿지 (1순위)</text>
      <text x="20" y="48" font-size="11" fill="#047857">http://localhost:5555</text>
      <text x="20" y="65" font-size="10" fill="#065f46">박물관 PC · node 실행 · 빠른 LAN</text>
      <text x="20" y="80" font-size="10" fill="#065f46">localStorage: jamsa_cctv_local_bridge</text>
    </g>

    <!-- 클라우드 브릿지 (2순위) -->
    <g transform="translate(420,160)">
      <rect width="280" height="90" rx="10" fill="url(#cloudBg)" stroke="#3b82f6" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#1e3a8a">☁️ 클라우드 브릿지 (2순위 폴백)</text>
      <text x="20" y="48" font-size="11" fill="#1e40af">https://cctv.thejamsa.com</text>
      <text x="20" y="65" font-size="10" fill="#1e3a8a">24/7 · 설치 불필요</text>
      <text x="20" y="80" font-size="10" fill="#1e3a8a">localStorage: jamsa_cctv_snap_server</text>
    </g>

    <!-- 화살표: 분기 → 로컬 -->
    <line x1="350" y1="100" x2="420" y2="80" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="370" y="80" font-size="10" font-weight="700" fill="#065f46">먼저 시도</text>

    <!-- 화살표: 분기 → 클라우드 -->
    <line x1="350" y1="140" x2="420" y2="200" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
    <text x="355" y="170" font-size="10" font-weight="700" fill="#1e40af">실패 시</text>

    <!-- NVR -->
    <g transform="translate(780,90)">
      <rect width="280" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#713f12">📹 NVR / DVR / 카메라</text>
      <text x="20" y="48" font-size="11" fill="#854d0e">SmartPSS · Dahua · Hikvision</text>
      <text x="20" y="65" font-size="11" fill="#854d0e">ONVIF · VMS Client</text>
      <text x="20" y="84" font-size="10" fill="#713f12">HTTP 스냅샷 → 브릿지가 프록시</text>
    </g>

    <!-- 화살표: 브릿지 → NVR -->
    <line x1="700" y1="85" x2="780" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="700" y1="205" x2="780" y2="160" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

    <!-- 하단 설명 -->
    <g transform="translate(40,290)">
      <rect width="1040" height="70" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
      <text x="20" y="25" font-size="13" font-weight="800" fill="#0c4a6e">💡 source.jsx의 getCctvServerCandidates() 함수가 자동 처리</text>
      <text x="20" y="45" font-size="11" fill="#075985">CctvLiveOverlay와 모든 스냅샷 폴링 코드는 반환된 URL 목록을 순서대로 시도합니다.</text>
      <text x="20" y="62" font-size="11" fill="#075985">로컬이 응답 안 하면 곧바로 클라우드로 fetch — 사용자가 알아채지 못함.</text>
    </g>
  </g>

  <!-- Section 3: 사용법 단계 -->
  <g transform="translate(40,770)">
    <rect width="1120" height="450" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#0f172a">⚙️ 설정 방법 (3단계)</text>

    <!-- Step 1 -->
    <g transform="translate(30,60)">
      <rect width="340" height="370" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="340" height="40" rx="10" fill="#3b82f6"/>
      <text x="170" y="27" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">STEP 1 · 페이지 진입</text>

      <text x="20" y="70" font-size="12" font-weight="800" fill="#0f172a">안전관리 → IoT 안전제어 →</text>
      <text x="20" y="90" font-size="12" font-weight="800" fill="#0f172a">📹 NVR/VMS 탭 클릭</text>

      <rect x="20" y="105" width="300" height="200" rx="6" fill="#1e293b"/>
      <text x="35" y="130" font-size="11" fill="#94a3b8">┌──────────────────────────┐</text>
      <text x="35" y="148" font-size="11" fill="#bae6fd">│ ☁️ 클라우드 브릿지    ✅정상 │</text>
      <text x="35" y="166" font-size="11" fill="#bae6fd">│ cctv.thejamsa.com        │</text>
      <text x="35" y="184" font-size="11" fill="#94a3b8">│ 📹 NVR 1대 · 채널 8개      │</text>
      <text x="35" y="202" font-size="11" fill="#94a3b8">├──────────────────────────┤</text>
      <text x="35" y="220" font-size="11" fill="#86efac">│ 🖥️ 로컬 브릿지       —    │</text>
      <text x="35" y="238" font-size="11" fill="#86efac">│ (비어 있음, 선택 사항)     │</text>
      <text x="35" y="256" font-size="11" fill="#94a3b8">│ [URL 입력] [🔄 확인] [제거] │</text>
      <text x="35" y="274" font-size="11" fill="#94a3b8">└──────────────────────────┘</text>

      <text x="20" y="325" font-size="11" fill="#475569">기본 화면. 클라우드는 이미 활성화됨.</text>
      <text x="20" y="345" font-size="11" fill="#475569">로컬 추가는 옵션입니다.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(390,60)">
      <rect width="340" height="370" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="340" height="40" rx="10" fill="#10b981"/>
      <text x="170" y="27" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">STEP 2 · 로컬 추가 (선택)</text>

      <text x="20" y="70" font-size="12" font-weight="800" fill="#0f172a">박물관 PC에서:</text>

      <rect x="20" y="85" width="300" height="100" rx="6" fill="#1e293b"/>
      <text x="35" y="108" font-size="11" fill="#86efac" font-family="monospace">$ node jamsa-cctv-bridge.cjs</text>
      <text x="35" y="126" font-size="11" fill="#94a3b8" font-family="monospace">▶ Jamsa CCTV Bridge v1.0</text>
      <text x="35" y="144" font-size="11" fill="#94a3b8" font-family="monospace">▶ Listening on :5555</text>
      <text x="35" y="162" font-size="11" fill="#94a3b8" font-family="monospace">▶ 1 NVR(s) configured</text>
      <text x="35" y="178" font-size="11" fill="#86efac" font-family="monospace">▶ ready ✓</text>

      <text x="20" y="210" font-size="12" font-weight="800" fill="#0f172a">잠사 패널 로컬 브릿지 입력란에:</text>

      <rect x="20" y="220" width="300" height="40" rx="6" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <text x="35" y="245" font-size="13" fill="#065f46" font-weight="700" font-family="monospace">http://localhost:5555</text>

      <text x="20" y="285" font-size="11" fill="#475569">또는 박물관 PC LAN IP:</text>
      <rect x="20" y="295" width="300" height="40" rx="6" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <text x="35" y="320" font-size="13" fill="#065f46" font-weight="700" font-family="monospace">http://192.168.0.X:5555</text>

      <text x="20" y="358" font-size="10" fill="#94a3b8">💾 입력 즉시 자동 저장 + 헬스체크</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(750,60)">
      <rect width="340" height="370" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="340" height="40" rx="10" fill="#f59e0b"/>
      <text x="170" y="27" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">STEP 3 · 자동 폴백 확인</text>

      <text x="20" y="70" font-size="12" font-weight="800" fill="#0f172a">두 카드 모두 ✅ 정상이면 OK</text>

      <rect x="20" y="85" width="300" height="120" rx="6" fill="#fff" stroke="#e2e8f0"/>
      <circle cx="40" cy="115" r="8" fill="#10b981"/>
      <text x="58" y="120" font-size="12" font-weight="800" fill="#065f46">🖥️ 로컬 ✅ 정상</text>
      <text x="58" y="138" font-size="10" fill="#475569">박물관 LAN에서 자동 우선 사용</text>

      <line x1="20" y1="155" x2="320" y2="155" stroke="#e2e8f0"/>

      <circle cx="40" cy="175" r="8" fill="#3b82f6"/>
      <text x="58" y="180" font-size="12" font-weight="800" fill="#1e3a8a">☁️ 클라우드 ✅ 정상</text>
      <text x="58" y="198" font-size="10" fill="#475569">로컬 장애 시 자동 폴백</text>

      <text x="20" y="235" font-size="12" font-weight="800" fill="#0f172a">테스트:</text>
      <text x="20" y="255" font-size="11" fill="#475569">1. 박물관 PC 끄기 → 로컬 ❌</text>
      <text x="20" y="273" font-size="11" fill="#475569">2. CCTV 화면 계속 표시 (클라우드)</text>
      <text x="20" y="291" font-size="11" fill="#475569">3. PC 다시 켜기 → 로컬 ✅</text>
      <text x="20" y="309" font-size="11" fill="#475569">4. 자동으로 로컬로 복귀</text>

      <rect x="20" y="325" width="300" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="170" y="348" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e">⚡ 사용자 개입 0회 · 끊김 없음</text>
    </g>
  </g>

  <!-- Section 4: localStorage 구조 -->
  <g transform="translate(40,1250)">
    <rect width="1120" height="160" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#0f172a">💾 저장 구조 (localStorage)</text>

    <g transform="translate(30,55)">
      <rect width="530" height="85" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="15" y="22" font-size="12" font-weight="900" fill="#1e3a8a">☁️ jamsa_cctv_snap_server</text>
      <text x="15" y="42" font-size="11" font-family="monospace" fill="#1e40af">"https://cctv.thejamsa.com"</text>
      <text x="15" y="62" font-size="10" fill="#1e40af">기본값 자동 설정 · 비워두면 클라우드 기본값으로 복원</text>
      <text x="15" y="78" font-size="10" fill="#1e40af">우선순위: 2 (폴백)</text>
    </g>

    <g transform="translate(580,55)">
      <rect width="510" height="85" rx="8" fill="#dcfce7" stroke="#10b981"/>
      <text x="15" y="22" font-size="12" font-weight="900" fill="#065f46">🖥️ jamsa_cctv_local_bridge</text>
      <text x="15" y="42" font-size="11" font-family="monospace" fill="#047857">"http://localhost:5555" (또는 비어 있음)</text>
      <text x="15" y="62" font-size="10" fill="#047857">사용자 입력 · 비우면 자동 제거</text>
      <text x="15" y="78" font-size="10" fill="#047857">우선순위: 1 (먼저 시도)</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40,1430)">
    <rect width="1120" height="140" rx="14" fill="#0f172a"/>
    <text x="20" y="35" font-size="16" font-weight="900" fill="#fff">🚀 핵심 코드 변경 위치</text>
    <text x="20" y="62" font-size="12" font-family="monospace" fill="#86efac">source.jsx:2831</text>
    <text x="180" y="62" font-size="12" fill="#cbd5e1">getStoredCctvLocalBridgeUrl() 신규 추가</text>
    <text x="20" y="84" font-size="12" font-family="monospace" fill="#86efac">source.jsx:2854</text>
    <text x="180" y="84" font-size="12" fill="#cbd5e1">getCctvServerCandidates() — 로컬 → 클라우드 자동 폴백</text>
    <text x="20" y="106" font-size="12" font-family="monospace" fill="#86efac">safety-cctv-nvr.jsx</text>
    <text x="180" y="106" font-size="12" fill="#cbd5e1">BridgeCard 컴포넌트 — 두 카드 분리 + 헬스체크</text>
    <text x="600" y="130" text-anchor="middle" font-size="11" fill="#64748b">한국잠사박물관 통합관리 시스템 · 듀얼 브릿지 자동 폴백</text>
  </g>
</svg>
