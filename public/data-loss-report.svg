<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" font-family="'Pretendard','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="dl-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dl-fix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="dl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1700" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="130" fill="url(#dl-hdr)"/>
  <text x="600" y="55" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">🔬 백엔드·클라우드·사진 데이터 유실 원인 + 재발 방지</text>
  <text x="600" y="90" text-anchor="middle" fill="#fff7ed" font-size="14">왜 사라졌나 · 지금 어떤 상태인가 · 어떻게 막을까</text>
  <text x="600" y="115" text-anchor="middle" fill="#fed7aa" font-size="12">잠사박물관 통합관리 시스템 · 진단 보고서</text>

  <!-- 5가지 원인 -->
  <g transform="translate(40,160)">
    <rect width="1120" height="540" rx="14" fill="#fff" filter="url(#dl-shadow)"/>
    <text x="20" y="35" font-size="22" font-weight="900" fill="#991b1b">📋 데이터 유실 5대 원인</text>

    <!-- 원인 1 -->
    <g transform="translate(20,55)">
      <rect width="1080" height="85" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="32" cy="42" r="22" fill="#dc2626"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">1</text>
      <text x="70" y="32" font-size="15" font-weight="900" fill="#991b1b">📸 사진을 base64 dataURL로 localStorage에 저장</text>
      <text x="70" y="52" font-size="12" fill="#0f172a">스마트폰 원본 1~3MB JPEG이 압축 없이 통째로 누적 → 사진 30장이면 90MB</text>
      <text x="70" y="70" font-size="11" font-style="italic" fill="#7f1d1d">예: jamsa_log_photos · jamsa_zone_photos · jamsa_product_intel(첨부물)</text>
    </g>

    <!-- 원인 2 -->
    <g transform="translate(20,150)">
      <rect width="1080" height="85" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="32" cy="42" r="22" fill="#dc2626"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">2</text>
      <text x="70" y="32" font-size="15" font-weight="900" fill="#991b1b">📦 localStorage 쿼터 5~10MB — 가득 차면 새 저장 실패 (조용히)</text>
      <text x="70" y="52" font-size="12" fill="#0f172a">브라우저별 5~10MB 한계. QuotaExceededError 발생 → setItem이 throw → 새 데이터 손실</text>
      <text x="70" y="70" font-size="11" font-style="italic" fill="#7f1d1d">증상: 새로 추가한 재고/품의/통화기록이 새로고침 후 사라짐</text>
    </g>

    <!-- 원인 3 -->
    <g transform="translate(20,245)">
      <rect width="1080" height="85" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="32" cy="42" r="22" fill="#dc2626"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">3</text>
      <text x="70" y="32" font-size="15" font-weight="900" fill="#991b1b">🚫 5MB 이상 값은 클라우드(Supabase) sync에서 silently skip</text>
      <text x="70" y="52" font-size="12" fill="#0f172a">entry.jsx의 안전장치가 큰 값을 콘솔 경고만 띄우고 건너뜀 → 백엔드엔 안 올라감 → 다른 기기 동기화 실패</text>
      <text x="70" y="70" font-size="11" font-style="italic" fill="#7f1d1d">증상: PC에서 만든 사진이 모바일에 안 보임, 로그아웃 후 다시 들어가면 사라짐</text>
    </g>

    <!-- 원인 4 -->
    <g transform="translate(20,340)">
      <rect width="1080" height="85" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="32" cy="42" r="22" fill="#dc2626"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">4</text>
      <text x="70" y="32" font-size="15" font-weight="900" fill="#991b1b">📊 사용량 모니터링 부재 — 쿼터 초과 직전에도 경고 없음</text>
      <text x="70" y="52" font-size="12" fill="#0f172a">사용자가 현재 몇 % 차있는지 알 수 없음. 어느 키가 비대해지는지 시각화 없음</text>
      <text x="70" y="70" font-size="11" font-style="italic" fill="#7f1d1d">결과: 임계점 모르고 계속 사진 업로드하다 한 순간에 다 손실</text>
    </g>

    <!-- 원인 5 -->
    <g transform="translate(20,435)">
      <rect width="1080" height="85" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="32" cy="42" r="22" fill="#dc2626"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">5</text>
      <text x="70" y="32" font-size="15" font-weight="900" fill="#991b1b">🔄 sync 실패 시 재시도/사용자 알림 없음</text>
      <text x="70" y="52" font-size="12" fill="#0f172a">네트워크 끊김·RLS 권한 거부·서버 오류 시 그냥 손실. 다음 변경까지 재시도 안 함</text>
      <text x="70" y="70" font-size="11" font-style="italic" fill="#7f1d1d">결과: 오프라인에서 작업한 내용이 다시 연결돼도 복구되지 않음</text>
    </g>
  </g>

  <!-- 재발 방지: 7가지 -->
  <g transform="translate(40,730)">
    <rect width="1120" height="540" rx="14" fill="#fff" filter="url(#dl-shadow)"/>
    <text x="20" y="35" font-size="22" font-weight="900" fill="#065f46">🛡️ 재발 방지 7대 대책 (이번 업데이트 적용)</text>

    <!-- Row 1 -->
    <g transform="translate(20,55)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 1. 자동 이미지 압축</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">모든 사진 업로드 시 캔버스로 1600px 장변 + JPEG 75%</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 3MB 사진이 200~500KB로 (70~85% 감소)</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">코드: data-loss-prevention.jsx compressImage()</text>
    </g>
    <g transform="translate(555,55)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 2. 사진 → IndexedDB 이동</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">localStorage엔 짧은 ref(idb:xxx)만, 실제 blob은 IndexedDB</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 무제한 용량, sync 차단도 해제</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">migrateLogPhotosToIDB() 1-click 마이그레이션</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20,165)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 3. 스토리지 사용량 실시간 모니터</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">키별 크기 분석 + 70% 도달 시 경고 + 5MB 초과 키 표시</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 임계점 전에 마이그레이션 권장</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">진단 패널 → 스토리지 게이지 + 큰 키 목록</text>
    </g>
    <g transform="translate(555,165)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 4. sync 차단 시 시각 알림</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">5MB 초과로 sync 안 된 키 → 클라우드 배지가 ⚠️로 바뀜</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ window.__syncSkipped에 누적</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">entry.jsx 수정 — 더 이상 silent fail 아님</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20,275)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 5. 카테고리별 자동 백업 (8개)</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">재고/결제: 1h · 안전·업무: 6h · 시설·IoT: 1d</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 어떤 데이터가 사라져도 직전 시점으로 복원 가능</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">BackupManagerModal · IndexedDB 무제한 보관</text>
    </g>
    <g transform="translate(555,275)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 6. 📌 핀 백업 영구 보관</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">중요 시점(분기말·이벤트 전후) 핀 → 자동 만료 제외</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 30일 보관 정책에도 살아남음</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">한 번 핀하면 영구 — 명시적 해제까지</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(20,385)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 7. 임포트 직전 자동 스냅샷</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">엑셀·CSV 일괄 업로드 직전 현재 상태 자동 저장</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 잘못 import해도 즉시 1-click 복원</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">importInventorySheet의 saveInventoryAutoBackup</text>
    </g>
    <g transform="translate(555,385)">
      <rect width="525" height="100" rx="10" fill="url(#dl-fix)" stroke="#86efac"/>
      <text x="15" y="25" font-size="13" font-weight="900" fill="#065f46">✅ 8. 안전 머지 복원</text>
      <text x="15" y="46" font-size="11" fill="#0f172a">백업 복원 시 비어있는 키만 채움 (기본값)</text>
      <text x="15" y="62" font-size="11" fill="#0f172a">→ 현재 데이터를 절대 손상시키지 않음</text>
      <text x="15" y="80" font-size="11" font-style="italic" fill="#047857">restoreFromBackup({mode:"merge"})</text>
    </g>
  </g>

  <!-- 사용 가이드 -->
  <g transform="translate(40,1300)">
    <rect width="1120" height="220" rx="14" fill="#0f172a" filter="url(#dl-shadow)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#fff">📚 지금 해야 할 일 (3단계)</text>

    <g transform="translate(20,55)">
      <rect width="350" height="140" rx="8" fill="#1e293b"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#86efac">STEP 1 · 지금 진단</text>
      <text x="20" y="50" font-size="11" fill="#e2e8f0">재고관리 → 일괄 업데이트</text>
      <text x="20" y="68" font-size="11" fill="#e2e8f0">→ 🛡️ 백업 관리자 → 카테고리 탭</text>
      <text x="20" y="86" font-size="11" fill="#e2e8f0">→ "🔬 유실 원인 진단" 클릭</text>
      <text x="20" y="106" font-size="10" fill="#94a3b8">스토리지 사용률·큰 키 확인</text>
      <text x="20" y="124" font-size="10" fill="#94a3b8">70% 넘으면 STEP 2 필수</text>
    </g>

    <g transform="translate(390,55)">
      <rect width="350" height="140" rx="8" fill="#1e293b"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#fde68a">STEP 2 · 사진 마이그레이션</text>
      <text x="20" y="50" font-size="11" fill="#e2e8f0">진단 패널 → "🚀 지금 이동" 클릭</text>
      <text x="20" y="68" font-size="11" fill="#e2e8f0">로그 사진을 IndexedDB로 이동</text>
      <text x="20" y="88" font-size="11" fill="#e2e8f0">localStorage 용량 대폭 감소</text>
      <text x="20" y="106" font-size="10" fill="#94a3b8">한 번만 실행하면 됨</text>
      <text x="20" y="124" font-size="10" fill="#94a3b8">새 사진은 자동 압축됨</text>
    </g>

    <g transform="translate(760,55)">
      <rect width="340" height="140" rx="8" fill="#1e293b"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#fca5a5">STEP 3 · 핀 백업 + 정기 점검</text>
      <text x="20" y="50" font-size="11" fill="#e2e8f0">백업 관리자 → 이력 탭</text>
      <text x="20" y="68" font-size="11" fill="#e2e8f0">중요 백업에 📌 핀</text>
      <text x="20" y="88" font-size="11" fill="#e2e8f0">월 1회 "💾 전체 백업+다운로드"</text>
      <text x="20" y="106" font-size="10" fill="#94a3b8">.json을 외부(드라이브)에 보관</text>
      <text x="20" y="124" font-size="10" fill="#94a3b8">최악의 경우 외부 파일로 복원</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40,1550)">
    <rect width="1120" height="120" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="32" font-size="14" font-weight="900" fill="#0f172a">📞 추가 보호 (선택)</text>
    <text x="20" y="55" font-size="11" fill="#475569">• Supabase 대시보드 → Storage → 일일 자동 export (외부 자동 백업 안전망)</text>
    <text x="20" y="75" font-size="11" fill="#475569">• Vercel 환경변수에 별도 백업 서버 URL 설정 → 큰 사진은 그쪽으로 우회 업로드</text>
    <text x="20" y="95" font-size="11" fill="#475569">• 사용자 교육: 사진 1회 업로드당 1장, 행사 후 한 번에 정리, 월말 핀 백업 1회</text>
    <text x="600" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">한국잠사박물관 통합관리 시스템 · 데이터 유실 방지 보고서</text>
  </g>
</svg>
