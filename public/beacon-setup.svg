<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1900" font-family="'Pretendard','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1400" height="1900" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="140" fill="url(#bgh)"/>
  <text x="700" y="60" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">📡 비콘 + 게이트웨이 연동 가이드</text>
  <text x="700" y="95" text-anchor="middle" font-size="16" fill="#e0f2fe">실내 위치 추적 · 자동 출입 감지 · 5단계 설치</text>
  <text x="700" y="120" text-anchor="middle" font-size="13" fill="#bae6fd">잠사박물관 통합관리 · BLE 비콘 + Minew G1 게이트웨이</text>

  <!-- 시스템 구조 다이어그램 -->
  <g transform="translate(50,170)">
    <rect width="1300" height="320" rx="14" fill="#fff" filter="url(#sh)"/>
    <text x="20" y="38" font-size="22" font-weight="900" fill="#0f172a">🏛️ 시스템 구조 한눈에 보기</text>

    <!-- 비콘 (왼쪽) -->
    <g transform="translate(60,80)">
      <rect width="220" height="200" rx="12" fill="url(#bge)" stroke="#3b82f6" stroke-width="2"/>
      <text x="110" y="35" text-anchor="middle" font-size="40">📡</text>
      <text x="110" y="80" text-anchor="middle" font-size="16" font-weight="900" fill="#1e40af">BLE 비콘</text>
      <text x="110" y="105" text-anchor="middle" font-size="11" fill="#1e3a8a">건전지로 작동</text>
      <text x="110" y="125" text-anchor="middle" font-size="11" fill="#1e3a8a">신호만 송신 (1초 주기)</text>
      <text x="110" y="155" text-anchor="middle" font-size="10" fill="#475569">개당 7,000~30,000원</text>
      <text x="110" y="175" text-anchor="middle" font-size="10" fill="#475569">건전지 2~3년</text>
    </g>

    <!-- 화살표 (비콘 → 게이트웨이) -->
    <line x1="290" y1="180" x2="450" y2="180" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arr)"/>
    <text x="370" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#0ea5e9">BLE 신호</text>
    <text x="370" y="195" text-anchor="middle" font-size="10" fill="#64748b">(~30m 도달)</text>

    <!-- 게이트웨이 (가운데) -->
    <g transform="translate(460,80)">
      <rect width="240" height="200" rx="12" fill="url(#bgp)" stroke="#7c3aed" stroke-width="2"/>
      <text x="120" y="35" text-anchor="middle" font-size="40">🌐</text>
      <text x="120" y="80" text-anchor="middle" font-size="16" font-weight="900" fill="#5b21b6">게이트웨이</text>
      <text x="120" y="105" text-anchor="middle" font-size="11" fill="#4c1d95">Minew G1, B-Fon</text>
      <text x="120" y="125" text-anchor="middle" font-size="11" fill="#4c1d95">Wi-Fi/LAN 연결</text>
      <text x="120" y="155" text-anchor="middle" font-size="10" fill="#475569">대당 67,000~298,000원</text>
      <text x="120" y="175" text-anchor="middle" font-size="10" fill="#475569">반경 300m 커버</text>
    </g>

    <!-- 화살표 (게이트웨이 → 인터넷) -->
    <line x1="710" y1="180" x2="870" y2="180" stroke="#10b981" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="790" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">HTTP POST</text>
    <text x="790" y="195" text-anchor="middle" font-size="10" fill="#64748b">webhook</text>

    <!-- 클라우드/패널 (오른쪽) -->
    <g transform="translate(880,80)">
      <rect width="240" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="120" y="35" text-anchor="middle" font-size="40">☁️</text>
      <text x="120" y="80" text-anchor="middle" font-size="16" font-weight="900" fill="#92400e">잠사 패널</text>
      <text x="120" y="105" text-anchor="middle" font-size="11" fill="#78350f">/api/beacon-webhook</text>
      <text x="120" y="125" text-anchor="middle" font-size="11" fill="#78350f">Supabase DB 저장</text>
      <text x="120" y="155" text-anchor="middle" font-size="10" fill="#475569">실시간 위치 표시</text>
      <text x="120" y="175" text-anchor="middle" font-size="10" fill="#475569">자동 출입 알림</text>
    </g>

    <!-- 사용자 (맨 오른쪽) -->
    <g transform="translate(1150,80)">
      <rect width="130" height="200" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="65" y="35" text-anchor="middle" font-size="40">📱</text>
      <text x="65" y="80" text-anchor="middle" font-size="14" font-weight="900" fill="#065f46">관리자/직원</text>
      <text x="65" y="105" text-anchor="middle" font-size="10" fill="#047857">통합 지도에서</text>
      <text x="65" y="125" text-anchor="middle" font-size="10" fill="#047857">위치 확인</text>
    </g>
  </g>

  <!-- 5단계 설치 -->
  <g transform="translate(50,520)">
    <rect width="1300" height="780" rx="14" fill="#fff" filter="url(#sh)"/>
    <text x="20" y="38" font-size="22" font-weight="900" fill="#0f172a">🛠️ 5단계 설치 가이드</text>

    <!-- STEP 1 -->
    <g transform="translate(20,70)">
      <rect width="1260" height="125" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="45" cy="60" r="32" fill="#3b82f6"/>
      <text x="45" y="70" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">1</text>
      <text x="100" y="42" font-size="18" font-weight="900" fill="#1e40af">🛒 장비 구매 (1~2주 소요)</text>
      <text x="100" y="68" font-size="13" fill="#0f172a">• Minew G1 게이트웨이 1대 (~67,000원) 또는 G1-E HTTP/MQTT 버전 (~253,000원)</text>
      <text x="100" y="88" font-size="13" fill="#0f172a">• BLE 비콘 4~8개 (개당 7,000~32,000원) — 박물관 구역 수만큼</text>
      <text x="100" y="108" font-size="13" fill="#0f172a">• 네이버 쇼핑/쿠팡에서 "Minew 게이트웨이" 또는 "현승코리아 비콘" 검색</text>
    </g>

    <!-- STEP 2 -->
    <g transform="translate(20,205)">
      <rect width="1260" height="125" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
      <circle cx="45" cy="60" r="32" fill="#7c3aed"/>
      <text x="45" y="70" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">2</text>
      <text x="100" y="42" font-size="18" font-weight="900" fill="#5b21b6">📍 게이트웨이 설치 (30분)</text>
      <text x="100" y="68" font-size="13" fill="#0f172a">• 박물관 중앙 천장/벽에 부착 (1.5m 이상, 콘센트 근처)</text>
      <text x="100" y="88" font-size="13" fill="#0f172a">• 전원 연결 + Wi-Fi/LAN 케이블 연결</text>
      <text x="100" y="108" font-size="13" fill="#0f172a">• 100평 이상이면 동별로 1대씩 (본관·체험관·식당) — G1은 300m 커버지만 벽 통과 시 약화</text>
    </g>

    <!-- STEP 3 -->
    <g transform="translate(20,340)">
      <rect width="1260" height="125" rx="10" fill="#dcfce7" stroke="#86efac"/>
      <circle cx="45" cy="60" r="32" fill="#10b981"/>
      <text x="45" y="70" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">3</text>
      <text x="100" y="42" font-size="18" font-weight="900" fill="#065f46">🎯 비콘 부착 (30분)</text>
      <text x="100" y="68" font-size="13" fill="#0f172a">• 구역마다 1~2개 부착 (수장고/온실/체험관/매점/주차장 등)</text>
      <text x="100" y="88" font-size="13" fill="#0f172a">• 양면테이프로 벽/천장/전시대 옆 (50cm~2m 높이)</text>
      <text x="100" y="108" font-size="13" fill="#0f172a">• 비콘마다 이름 메모 ("수장고 정문" "체험관 2층" 등) — 등록 시 사용</text>
    </g>

    <!-- STEP 4 -->
    <g transform="translate(20,475)">
      <rect width="1260" height="125" rx="10" fill="#fef3c7" stroke="#fde68a"/>
      <circle cx="45" cy="60" r="32" fill="#f59e0b"/>
      <text x="45" y="70" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">4</text>
      <text x="100" y="42" font-size="18" font-weight="900" fill="#92400e">🌐 게이트웨이 설정 (10분)</text>
      <text x="100" y="68" font-size="13" fill="#0f172a">• 게이트웨이 관리자 앱(Minew Cloud 등) 접속 → "Webhook" 또는 "HTTP Push" 설정</text>
      <text x="100" y="88" font-size="13" fill="#0f172a">• URL 입력: <tspan font-family="monospace" font-weight="900" fill="#92400e">https://jamsa-panel.vercel.app/api/beacon-webhook</tspan></text>
      <text x="100" y="108" font-size="13" fill="#0f172a">• 잠사 패널 → 비콘 관리자 → 🌐 게이트웨이 탭에서 정확한 URL 복사 가능</text>
    </g>

    <!-- STEP 5 -->
    <g transform="translate(20,610)">
      <rect width="1260" height="140" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="45" cy="68" r="32" fill="#dc2626"/>
      <text x="45" y="78" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">5</text>
      <text x="100" y="42" font-size="18" font-weight="900" fill="#991b1b">🧪 실시간 테스트 + 비콘 등록</text>
      <text x="100" y="68" font-size="13" fill="#0f172a">• 잠사 패널 → 통합지도 → "📡 비콘 관리자" → 🧪 실시간 테스트 → "지금 테스트 실행"</text>
      <text x="100" y="88" font-size="13" fill="#0f172a">• ✅ 연동 정상 확인 후 → 🌐 게이트웨이 탭에서 최근 수신 데이터 자동 표시</text>
      <text x="100" y="108" font-size="13" fill="#0f172a">• 📡 비콘 스캔 탭에서 감지된 비콘마다 구역 매핑 (예: "수장고 정문" → 수장고)</text>
      <text x="100" y="128" font-size="13" fill="#0f172a">• 완료! 이제 박물관 내 어디서든 자동으로 구역 감지됨</text>
    </g>
  </g>

  <!-- 활용 시나리오 -->
  <g transform="translate(50,1330)">
    <rect width="1300" height="270" rx="14" fill="#0f172a" filter="url(#sh)"/>
    <text x="20" y="38" font-size="22" font-weight="900" fill="#fff">💡 활용 시나리오</text>

    <g transform="translate(20,70)">
      <rect width="305" height="180" rx="10" fill="#1e293b"/>
      <text x="20" y="35" font-size="28" fill="#86efac">📍</text>
      <text x="20" y="65" font-size="14" font-weight="900" fill="#86efac">자동 출입 감지</text>
      <text x="20" y="90" font-size="11" fill="#e2e8f0">관리자가 시설 진입 시</text>
      <text x="20" y="108" font-size="11" fill="#e2e8f0">자동 알림 + 활동 로그</text>
      <text x="20" y="135" font-size="11" fill="#94a3b8">예: "이경연 9:15 수장고 진입"</text>
      <text x="20" y="155" font-size="11" fill="#94a3b8">→ 업무일지 자동 시작</text>
    </g>

    <g transform="translate(345,70)">
      <rect width="305" height="180" rx="10" fill="#1e293b"/>
      <text x="20" y="35" font-size="28" fill="#fde68a">🚨</text>
      <text x="20" y="65" font-size="14" font-weight="900" fill="#fde68a">안전 경보</text>
      <text x="20" y="90" font-size="11" fill="#e2e8f0">관람객이 출입금지 구역</text>
      <text x="20" y="108" font-size="11" fill="#e2e8f0">진입 시 즉시 알림</text>
      <text x="20" y="135" font-size="11" fill="#94a3b8">예: "비콘 미등록 휴대폰"</text>
      <text x="20" y="155" font-size="11" fill="#94a3b8">→ CCTV 자동 녹화</text>
    </g>

    <g transform="translate(670,70)">
      <rect width="305" height="180" rx="10" fill="#1e293b"/>
      <text x="20" y="35" font-size="28" fill="#fca5a5">📊</text>
      <text x="20" y="65" font-size="14" font-weight="900" fill="#fca5a5">동선 분석</text>
      <text x="20" y="90" font-size="11" fill="#e2e8f0">방문객 체류 시간/구역별</text>
      <text x="20" y="108" font-size="11" fill="#e2e8f0">통계 자동 수집</text>
      <text x="20" y="135" font-size="11" fill="#94a3b8">예: "체험관 평균 23분"</text>
      <text x="20" y="155" font-size="11" fill="#94a3b8">→ 동선 최적화 자료</text>
    </g>

    <g transform="translate(995,70)">
      <rect width="285" height="180" rx="10" fill="#1e293b"/>
      <text x="20" y="35" font-size="28" fill="#c4b5fd">🎫</text>
      <text x="20" y="65" font-size="14" font-weight="900" fill="#c4b5fd">자동 출퇴근</text>
      <text x="20" y="90" font-size="11" fill="#e2e8f0">직원 비콘 휴대 시</text>
      <text x="20" y="108" font-size="11" fill="#e2e8f0">출퇴근 자동 기록</text>
      <text x="20" y="135" font-size="11" fill="#94a3b8">예: "정문 비콘 통과"</text>
      <text x="20" y="155" font-size="11" fill="#94a3b8">→ 근무시간 자동 산정</text>
    </g>
  </g>

  <!-- 예상 비용 -->
  <g transform="translate(50,1630)">
    <rect width="1300" height="230" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="38" font-size="22" font-weight="900" fill="#0f172a">💰 예상 비용 (잠사박물관 규모 기준)</text>
    <text x="20" y="65" font-size="12" fill="#64748b">중규모 박물관 (8구역, 본관+체험관+식당) 1회 투자 비용</text>

    <g transform="translate(20,80)">
      <rect x="0" y="0" width="630" height="50" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="15" y="32" font-size="13" font-weight="700" fill="#0f172a">Minew G1 게이트웨이 × 2대 (본관·체험관)</text>
      <text x="615" y="32" text-anchor="end" font-size="13" font-weight="900" fill="#0ea5e9">134,000원</text>

      <rect x="0" y="50" width="630" height="50" fill="#fff" stroke="#e5e7eb"/>
      <text x="15" y="82" font-size="13" font-weight="700" fill="#0f172a">현승코리아 BLE 비콘 × 8개 (구역별 1개)</text>
      <text x="615" y="82" text-anchor="end" font-size="13" font-weight="900" fill="#0ea5e9">~256,000원</text>

      <rect x="0" y="100" width="630" height="50" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="15" y="132" font-size="13" font-weight="700" fill="#0f172a">설치/배선 (직접 시공 시 무료)</text>
      <text x="615" y="132" text-anchor="end" font-size="13" font-weight="900" fill="#10b981">0원</text>

      <rect x="0" y="150" width="630" height="60" fill="#fef3c7" stroke="#fde68a"/>
      <text x="15" y="187" font-size="16" font-weight="900" fill="#92400e">💵 총 1회 투자 비용</text>
      <text x="615" y="187" text-anchor="end" font-size="20" font-weight="900" fill="#92400e">~390,000원</text>
    </g>

    <g transform="translate(670,80)">
      <rect width="610" height="130" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="20" y="32" font-size="14" font-weight="900" fill="#1e40af">💡 운영 비용</text>
      <text x="20" y="58" font-size="11" fill="#0f172a">• 전기료: 게이트웨이 1대 ~5W (월 ~1,000원)</text>
      <text x="20" y="78" font-size="11" fill="#0f172a">• Wi-Fi 사용 (기존 박물관 인프라 활용)</text>
      <text x="20" y="98" font-size="11" fill="#0f172a">• 비콘 건전지: 2~3년 무교체 (CR2477 ~3,000원)</text>
      <text x="20" y="118" font-size="11" fill="#0f172a">• 잠사 패널 webhook: 무료 (Vercel 무료 플랜 내)</text>

      <rect y="140" width="610" height="60" rx="8" fill="#dcfce7" stroke="#86efac"/>
      <text x="20" y="172" font-size="14" font-weight="900" fill="#065f46">⏱️ 회수 기간</text>
      <text x="20" y="192" font-size="11" fill="#065f46">관리자 1명의 출입 점검 시간 절약만으로 6개월 내 회수</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="700" y="1888" text-anchor="middle" font-size="11" fill="#94a3b8">한국잠사박물관 통합관리 시스템 · 비콘 + 게이트웨이 연동 가이드 v1.0</text>
</svg>
