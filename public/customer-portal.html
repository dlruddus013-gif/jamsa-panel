<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>서비스 진행 상태 · 한국잠사플레이팜</title>
<link rel="manifest" href="/manifest.json" />
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Noto Sans KR',-apple-system,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.5;padding:0}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid #e2e8f0;font-weight:800}
  .topbar .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:700}
  .banner{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:12px;color:#fff;margin-bottom:16px;background:linear-gradient(135deg,#16a34a,#15803d);box-shadow:0 4px 14px rgba(22,163,74,0.18)}
  .banner .icon{font-size:34px}
  .banner h1{font-size:18px;font-weight:800;margin-bottom:4px}
  .banner p{font-size:12px;opacity:.92}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:14px}
  .card h3{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .pill{font-size:10px;padding:2px 7px;border-radius:10px;background:#f1f5f9;color:#475569;font-weight:700}
  .status-big{padding:16px;border-radius:10px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #a7f3d0;margin-bottom:14px}
  .status-big .lbl{font-size:11px;font-weight:700;color:#047857;margin-bottom:4px}
  .status-big .val{font-size:20px;font-weight:900;color:#064e3b;margin-bottom:4px}
  .status-big .sub{font-size:12px;color:#047857}
  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:#e2e8f0}
  .ev{position:relative;padding:6px 0 14px;font-size:12.5px}
  .ev .dot{position:absolute;left:-22px;top:8px;width:14px;height:14px;border-radius:50%;background:#16a34a;border:2px solid #fff;box-shadow:0 0 0 1px #16a34a}
  .ev .dot.scheduled{background:#fbbf24;box-shadow:0 0 0 1px #fbbf24}
  .ev .dot.pending{background:#cbd5e1;box-shadow:0 0 0 1px #cbd5e1}
  .ev .lbl{font-weight:700}
  .ev .meta{font-size:11.5px;color:#64748b;margin-top:2px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9}
  .row:first-child{border-top:none}
  .row .name{font-size:12.5px;font-weight:700}
  .row .meta{font-size:11px;color:#64748b;margin-top:2px}
  .ok-pill{padding:3px 9px;border-radius:10px;font-size:10.5px;font-weight:700;background:#dcfce7;color:#166534}
  .privacy{background:#fefce8;border:1px solid #fde047;color:#854d0e;padding:10px 12px;border-radius:8px;font-size:11.5px;margin-top:10px;line-height:1.55}
  .btn{padding:9px 16px;border-radius:7px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
  .btn.primary{border:none;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .modal h3{font-size:15px;font-weight:800;margin-bottom:6px}
  .modal .sub{font-size:11.5px;color:#64748b;margin-bottom:14px;line-height:1.55}
  .modal label{display:block;font-size:11px;font-weight:700;margin:10px 0 4px;color:#475569}
  .modal select,.modal input,.modal textarea{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12.5px;font-family:inherit}
  .modal textarea{resize:vertical;min-height:70px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:8px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  .toast.good{background:#15803d}
  .empty{padding:40px 20px;text-align:center;color:#64748b}
  .empty h2{font-size:16px;color:#0f172a;margin-bottom:8px}
  .empty p{font-size:12.5px}
</style>
</head>
<body>

<div class="topbar">
  <span style="font-size:18px">🤝</span>
  <span>서비스 진행 상태</span>
  <span class="badge">한국잠사플레이팜</span>
</div>

<div class="wrap" id="root"></div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-inner"></div></div>
<div class="toast" id="toast"></div>

<script>
// 설계 §11.1 Tier 1 — 토큰 URL 기반 익명 조회. Tier 2(OTP)·Tier 3(계정)는 Phase 3.
// 토큰은 ?token=XXXX 쿼리 또는 #token=XXXX 해시로 받음.

const $ = (s, r=document) => r.querySelector(s);
function getToken() {
  const url = new URL(location.href);
  return url.searchParams.get("token") || (location.hash.match(/token=([^&]+)/) || [])[1] || "";
}
function toast(msg, kind="") {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show " + kind;
  setTimeout(() => t.classList.remove("show"), 2400);
}
function openModal(html) { $("#modal-inner").innerHTML = html; $("#modal-bg").classList.add("open"); }
function closeModal() { $("#modal-bg").classList.remove("open"); }
$("#modal-bg").addEventListener("click", e => { if (e.target.id === "modal-bg") closeModal(); });

// Phase 3: 실제 API 연동 (Tier 1 익명 조회)
async function fetchSession(token) {
  try {
    const r = await fetch(`/api/customer-session?token=${encodeURIComponent(token)}`);
    if (!r.ok) {
      // 운영 환경에서 DB 미세팅이거나 토큰 만료 시 mock 으로 fallback (시연용)
      if (r.status === 404 && token === "DEMO-1234") return mockFallback();
      return null;
    }
    const j = await r.json();
    if (!j.ok || !j.session) return null;
    const s = j.session;
    const fmt = (iso) => iso ? new Date(iso).toTimeString().slice(0, 5) : "-";
    return {
      customer_org: s.customer_org,
      site: s.site,
      scheduled_time: fmt(s.scheduled_at),
      status: s.status,
      delay_min: s.delay_min || 0,
      issues: s.issue_count || 0,
      actual_arrival: fmt(s.actual_arrival_at),
      scheduled_end: fmt(new Date(new Date(s.scheduled_at).getTime() + (s.scheduled_duration_min || 60) * 60000).toISOString()),
      report_at: "18:00",
      staff_team: "한국잠사박물관 운영팀",
      staff_count: s.assigned_staff_count || 0,
      session_id: s.id,
    };
  } catch (e) {
    console.warn("[customer-portal] fetch failed:", e);
    return token === "DEMO-1234" ? mockFallback() : null;
  }
}
function mockFallback() {
  return {
    customer_org: "청주시 시설관리공단",
    site: "한국잠사박물관",
    scheduled_time: "14:00",
    status: "arrived",
    delay_min: 0,
    issues: 0,
    actual_arrival: "13:52",
    scheduled_end: "17:00",
    report_at: "18:00",
    staff_team: "한국잠사박물관 운영팀",
    staff_count: 2,
  };
}
window.__sessionToken = "";

function renderEmpty(reason) {
  $("#root").innerHTML = `
    <div class="card empty">
      <h2>⛔ 조회 불가</h2>
      <p>${reason}</p>
      <p style="margin-top:16px;font-size:11.5px;color:#94a3b8">문의: 한국잠사플레이팜 운영팀<br/>본 페이지는 발급된 링크로만 접근 가능합니다.</p>
    </div>`;
}

function statusKor(s, delay) {
  const map = {
    scheduled: "예정", arrived: "담당 인력 현장 도착 완료",
    started: "서비스 진행 중", completed: "서비스 완료",
    delayed: `지연 (${delay}분)`, cancelled: "취소됨",
  };
  return map[s] || s;
}

async function main() {
  const token = getToken();
  if (!token) {
    renderEmpty("토큰이 없습니다. 발급받은 링크로 접속해주세요.");
    return;
  }
  window.__sessionToken = token;
  const s = await fetchSession(token);
  if (!s) {
    renderEmpty("유효하지 않거나 만료된 토큰입니다. 새 링크를 요청해주세요.");
    return;
  }
  $("#root").innerHTML = `
    <div class="banner">
      <div class="icon">🤝</div>
      <div>
        <h1>${escape_(s.customer_org)} — 서비스 진행 상태</h1>
        <p>직원 실명·좌표·이동 경로 미노출. 도착·시작·지연·이슈 신고·일일 리포트만 제공.</p>
      </div>
    </div>

    <div class="status-big">
      <div class="lbl">현재 상태</div>
      <div class="val">${escape_(statusKor(s.status, s.delay_min))}</div>
      <div class="sub">${escape_(s.site)} · 서비스 시작 예정 ${escape_(s.scheduled_time)} · ${s.delay_min ? `지연 ${s.delay_min}분` : "지연 없음"}</div>
    </div>

    <div class="card">
      <h3>📍 진행 타임라인 <span class="pill">${escape_(s.site)}</span></h3>
      <div class="timeline">
        <div class="ev"><div class="dot"></div><div class="lbl">담당 인력 현장 도착</div><div class="meta">${escape_(s.actual_arrival)} · 정시 도착</div></div>
        <div class="ev"><div class="dot scheduled"></div><div class="lbl">서비스 시작 예정</div><div class="meta">${escape_(s.scheduled_time)} · 5분 전 알림 발송 예정</div></div>
        <div class="ev"><div class="dot pending"></div><div class="lbl">서비스 종료 예정</div><div class="meta">${escape_(s.scheduled_end)}</div></div>
        <div class="ev"><div class="dot pending"></div><div class="lbl">일일 리포트 발송</div><div class="meta">${escape_(s.report_at)} (익명 통계)</div></div>
      </div>
    </div>

    <div class="card">
      <h3>📋 일일 리포트 (개인정보 보호형)</h3>
      <div class="row"><div><div class="name">담당 인력</div><div class="meta">소속: ${escape_(s.staff_team)} · ${s.staff_count}명 배정</div></div><span class="ok-pill">배정 완료</span></div>
      <div class="row"><div><div class="name">정시 도착</div><div class="meta">예정 ${escape_(s.scheduled_time)} → 실제 ${escape_(s.actual_arrival)}</div></div><span class="ok-pill">정상</span></div>
      <div class="row"><div><div class="name">지연</div><div class="meta">${s.delay_min ? s.delay_min + "분" : "없음"}</div></div><span class="ok-pill">${s.delay_min ? "주의" : "0건"}</span></div>
      <div class="row"><div><div class="name">고객 이슈</div><div class="meta">${s.issues ? s.issues + "건 접수됨" : "접수된 이슈 없음"}</div></div><span class="ok-pill">${s.issues}건</span></div>
      <div class="privacy">⚠️ 직원의 실명, 정확한 GPS 좌표, 이동 경로는 고객님께 제공되지 않습니다. 서비스 진행 상태만 공유됩니다.</div>
    </div>

    <div class="card">
      <h3>🚨 이슈 신고</h3>
      <p style="font-size:11.5px;color:#64748b;line-height:1.55;margin-bottom:10px">서비스 중 문제가 있으면 알려주세요. 직접 직원에게 연락하지 않으셔도 됩니다.</p>
      <div class="toolbar">
        <button class="btn primary" onclick="openIssue()">이슈 신고</button>
        <button class="btn" onclick="openOtpRequest()">상세 리포트 요청 (OTP)</button>
      </div>
      <p style="font-size:10.5px;color:#94a3b8;margin-top:10px">상세 리포트·현장 사진·이슈 상세 등 민감 정보는 Tier 2 OTP 인증 후 제공됩니다 (Phase 3).</p>
    </div>
  `;
}

function escape_(s) {
  return String(s == null ? "" : s).replace(/[<>&"']/g, c => ({ "<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;" }[c]));
}

window.openIssue = function() {
  openModal(`
    <h3>🚨 이슈 신고</h3>
    <p class="sub">서비스 진행 중 문제가 있으면 알려주세요. 담당자에게 직접 전달됩니다.</p>
    <label>이슈 유형</label>
    <select id="issueType"><option>약속 시간보다 지연</option><option>서비스 품질 문제</option><option>시설/장비 문제</option><option>기타</option></select>
    <label>상세 내용</label>
    <textarea id="issueDetail" placeholder="가능한 자세히 작성해주세요."></textarea>
    <label>회신 받을 연락처 (선택)</label>
    <input id="issueContact" placeholder="010-0000-0000"/>
    <div class="actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="submitIssue()">신고</button>
    </div>
  `);
};
window.submitIssue = async function() {
  const type = $("#issueType").value;
  const detail = $("#issueDetail").value.trim();
  const contact = $("#issueContact").value.trim();
  if (detail.length < 5) { toast("상세 내용을 더 자세히 작성해주세요", "warn"); return; }
  try {
    const r = await fetch("/api/customer-session?action=issue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: window.__sessionToken, type, detail, contact: contact || null }),
    });
    const j = await r.json();
    closeModal();
    if (r.ok && j.ok) {
      toast("이슈 접수 완료 · 30분 내 회신", "good");
    } else {
      toast("접수 실패: " + (j.error || "unknown"));
    }
  } catch (e) {
    closeModal();
    toast("네트워크 오류 — 다시 시도해주세요");
  }
};
window.openOtpRequest = function() {
  openModal(`
    <h3>🔐 OTP 인증 (Tier 2)</h3>
    <p class="sub">상세 리포트·현장 사진 등 민감 정보 열람은 OTP 인증이 필요합니다.<br/>등록된 담당자 이메일로 6자리 인증코드를 발송합니다.</p>
    <label>이메일</label>
    <input id="otpEmail" type="email" placeholder="등록된 담당자 이메일" />
    <div id="otpSendError" style="display:none;font-size:11.5px;color:#b91c1c;margin-top:6px"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="sendOtp()">인증코드 발송</button>
    </div>
  `);
};

window.sendOtp = async function() {
  const email = document.getElementById("otpEmail").value.trim();
  const errEl = document.getElementById("otpSendError");
  errEl.style.display = "none";
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = "올바른 이메일을 입력해주세요"; errEl.style.display = "block"; return;
  }
  try {
    const r = await fetch("/api/customer-otp?action=send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: window.__sessionToken, email, purpose: "detail_view" }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) {
      const msg = j.error === "email_mismatch" ? "등록된 담당자 이메일과 다릅니다"
        : j.error === "rate_limit" ? "1분 후 다시 시도해주세요"
        : j.error === "session_has_no_contact_email" ? "이 세션에 담당자 이메일이 등록되어 있지 않습니다"
        : (j.detail || j.error || "발송 실패");
      errEl.textContent = msg; errEl.style.display = "block"; return;
    }
    window.__otpEmail = email;
    openOtpVerify(j.provider === "simulated");
  } catch (e) {
    errEl.textContent = "네트워크 오류: " + e.message; errEl.style.display = "block";
  }
};

window.openOtpVerify = function(simulated) {
  openModal(`
    <h3>🔐 인증코드 입력</h3>
    <p class="sub">${escape_(window.__otpEmail)} 로 발송된 6자리 코드를 입력하세요.<br/>유효시간 10분.${simulated ? '<br/><b style="color:#92400e">⚠️ 시연 모드 — 코드는 서버 콘솔에 출력됩니다 (RESEND_API_KEY 미설정).</b>' : ''}</p>
    <label>인증코드 (6자리)</label>
    <input id="otpCode" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:18px;letter-spacing:6px;text-align:center" />
    <div id="otpVerifyError" style="display:none;font-size:11.5px;color:#b91c1c;margin-top:6px"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="verifyOtp()">인증</button>
    </div>
  `);
};

window.verifyOtp = async function() {
  const code = document.getElementById("otpCode").value.trim();
  const errEl = document.getElementById("otpVerifyError");
  errEl.style.display = "none";
  if (!/^\d{6}$/.test(code)) {
    errEl.textContent = "6자리 숫자를 입력해주세요"; errEl.style.display = "block"; return;
  }
  try {
    const r = await fetch("/api/customer-otp?action=verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: window.__sessionToken, email: window.__otpEmail, code, purpose: "detail_view" }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) {
      const msg = j.error === "invalid_code" ? `잘못된 코드 (남은 시도: ${j.remaining})`
        : j.error === "otp_expired" ? "코드 만료 — 다시 발송해주세요"
        : j.error === "too_many_attempts" ? "시도 횟수 초과"
        : (j.detail || j.error || "검증 실패");
      errEl.textContent = msg; errEl.style.display = "block"; return;
    }
    closeModal();
    showDetailReport(j);
  } catch (e) {
    errEl.textContent = "네트워크 오류: " + e.message; errEl.style.display = "block";
  }
};

window.showDetailReport = function(data) {
  const s = data.session || {};
  const events = data.events || [];
  openModal(`
    <h3>📋 상세 리포트 (Tier 2)</h3>
    <p class="sub">${escape_(s.customer_org || "")} · ${escape_(s.site_name || "")}</p>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:10px 0;font-size:12px;line-height:1.8">
      <div>📅 예정: ${escape_(s.scheduled_at ? new Date(s.scheduled_at).toLocaleString("ko-KR") : "-")}</div>
      <div>⏱️ 진행 시간: ${s.scheduled_duration_min || 0}분</div>
      <div>📍 실제 도착: ${escape_(s.actual_arrival_at ? new Date(s.actual_arrival_at).toLocaleString("ko-KR") : "미도착")}</div>
      <div>👥 배정 인원: ${s.assigned_staff_count || 0}명 (직원 식별 정보 비공개)</div>
      <div>📊 현재 상태: <b>${escape_(s.status || "-")}</b> · 지연 ${s.delay_min || 0}분 · 이슈 ${s.issue_count || 0}건</div>
    </div>
    ${events.length > 0 ? `
      <div style="font-size:12px;font-weight:700;margin:10px 0 6px">📜 이벤트 이력</div>
      <div style="max-height:200px;overflow:auto;font-size:11.5px">
        ${events.map(e => `<div style="padding:6px 0;border-top:1px solid #f1f5f9">• ${escape_(e.action)} · ${escape_(new Date(e.at).toLocaleString("ko-KR"))}</div>`).join("")}
      </div>
    ` : '<div style="font-size:11.5px;color:#64748b">기록된 이벤트 없음</div>'}
    <div class="privacy" style="margin-top:12px">⚠️ Tier 2 인증으로 열람한 데이터입니다. 직원 실명·좌표·이동경로는 여전히 제공되지 않습니다.</div>
    <div class="actions">
      <button class="btn primary" onclick="closeModal()">확인</button>
    </div>
  `);
};

main();
</script>
</body>
</html>
