<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2400" font-family="'Pretendard','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1400" height="2400" fill="#f8fafc"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1400" height="150" fill="url(#hdr)"/>
  <text x="700" y="60" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">🛰️ 비콘 엣지 서버 — 실전 가이드</text>
  <text x="700" y="98" text-anchor="middle" font-size="15" fill="#cbd5e1">설치 → 게이트웨이 연결 → 매핑 → 대시보드 확인</text>
  <text x="700" y="125" text-anchor="middle" font-size="13" fill="#bae6fd">잠사박물관 통합관리 시스템 · beacon-edge-server v1.0</text>

  <!-- 시스템 다이어그램 -->
  <g transform="translate(50,180)">
    <rect width="1300" height="280" rx="14" fill="#fff" filter="url(#sh)"/>
    <text x="20" y="35" font-size="20" font-weight="900" fill="#0f172a">🏗️ 데이터 흐름</text>

    <!-- 비콘 -->
    <g transform="translate(40,70)">
      <rect width="170" height="170" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="85" y="50" text-anchor="middle" font-size="40">📡</text>
      <text x="85" y="95" text-anchor="middle" font-size="14" font-weight="900" fill="#92400e">BLE 비콘</text>
      <text x="85" y="115" text-anchor="middle" font-size="10" fill="#78350f">major=1, minor=1</text>
      <text x="85" y="135" text-anchor="middle" font-size="10" fill="#78350f">전시실 1</text>
      <text x="85" y="155" text-anchor="middle" font-size="9" fill="#a16207">건전지 2~3년</text>
    </g>

    <line x1="220" y1="155" x2="290" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
    <text x="255" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#3b82f6">BLE</text>
    <text x="255" y="170" text-anchor="middle" font-size="9" fill="#64748b">~30m</text>

    <!-- 게이트웨이 -->
    <g transform="translate(300,70)">
      <rect width="200" height="170" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="100" y="50" text-anchor="middle" font-size="40">🌐</text>
      <text x="100" y="95" text-anchor="middle" font-size="14" font-weight="900" fill="#1e40af">Minew G1</text>
      <text x="100" y="115" text-anchor="middle" font-size="10" fill="#1e3a8a">Wi-Fi/LAN 연결</text>
      <text x="100" y="135" text-anchor="middle" font-size="10" fill="#1e3a8a">HTTP Push 모드</text>
      <text x="100" y="155" text-anchor="middle" font-size="9" fill="#1e40af">반경 300m</text>
    </g>

    <line x1="510" y1="155" x2="590" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
    <text x="550" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#3b82f6">HTTP POST</text>
    <text x="550" y="170" text-anchor="middle" font-size="9" fill="#64748b">/api/beacon/log</text>

    <!-- 엣지 서버 -->
    <g transform="translate(600,70)">
      <rect width="220" height="170" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="110" y="50" text-anchor="middle" font-size="40">🖥️</text>
      <text x="110" y="95" text-anchor="middle" font-size="14" font-weight="900" fill="#065f46">엣지 서버 :8088</text>
      <text x="110" y="115" text-anchor="middle" font-size="10" fill="#047857">FastAPI + SQLite</text>
      <text x="110" y="135" text-anchor="middle" font-size="10" fill="#047857">JSONL 백업</text>
      <text x="110" y="155" text-anchor="middle" font-size="9" fill="#065f46">박물관 PC 또는 사내 서버</text>
    </g>

    <line x1="830" y1="155" x2="900" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
    <text x="865" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#3b82f6">SSE</text>

    <!-- 대시보드 -->
    <g transform="translate(910,70)">
      <rect width="190" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="95" y="50" text-anchor="middle" font-size="40">📊</text>
      <text x="95" y="95" text-anchor="middle" font-size="14" font-weight="900" fill="#5b21b6">대시보드</text>
      <text x="95" y="115" text-anchor="middle" font-size="10" fill="#4c1d95">실시간 로그</text>
      <text x="95" y="135" text-anchor="middle" font-size="10" fill="#4c1d95">/dashboard</text>
      <text x="95" y="155" text-anchor="middle" font-size="9" fill="#5b21b6">위치/직원 자동 인식</text>
    </g>

    <line x1="1110" y1="155" x2="1180" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>

    <!-- 잠사 패널 -->
    <g transform="translate(1190,70)">
      <rect width="100" height="170" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="50" y="50" text-anchor="middle" font-size="40">🏛️</text>
      <text x="50" y="95" text-anchor="middle" font-size="12" font-weight="900" fill="#991b1b">잠사 패널</text>
      <text x="50" y="115" text-anchor="middle" font-size="9" fill="#7f1d1d">통합지도</text>
      <text x="50" y="135" text-anchor="middle" font-size="9" fill="#7f1d1d">자동 표시</text>
    </g>
  </g>

  <!-- STEP 1 -->
  <g transform="translate(50,490)">
    <rect width="1300" height="280" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="1300" height="50" rx="14" fill="#10b981"/>
    <text x="20" y="33" font-size="18" font-weight="900" fill="#fff">STEP 1 · 서버 설치 (한 번만, 5분)</text>

    <g transform="translate(40,70)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#0f172a">📦 박물관 PC 또는 사내 서버에서:</text>

      <rect x="0" y="35" width="1220" height="160" rx="8" fill="#0f172a"/>
      <text x="20" y="60" font-size="11" fill="#86efac" font-family="monospace"># 1. 코드 받기</text>
      <text x="20" y="80" font-size="12" fill="#fff" font-family="monospace">git clone https://github.com/dlruddus013-gif/jamsa-panel.git</text>
      <text x="20" y="100" font-size="12" fill="#fff" font-family="monospace">cd jamsa-panel/beacon-edge-server</text>

      <text x="20" y="130" font-size="11" fill="#86efac" font-family="monospace"># 2. 실행 (Windows)</text>
      <text x="20" y="150" font-size="12" fill="#fff" font-family="monospace">run.bat 더블클릭     ← Python 자동 설치 + 서버 시작</text>

      <text x="20" y="180" font-size="11" fill="#86efac" font-family="monospace"># 2. 실행 (Linux/Mac)</text>
      <text x="650" y="180" font-size="11" fill="#86efac" font-family="monospace"># 또는 수동</text>
      <text x="20" y="200" font-size="12" fill="#fff" font-family="monospace">./run.sh</text>
      <text x="650" y="200" font-size="11" fill="#fff" font-family="monospace">pip install -r requirements.txt</text>
    </g>

    <g transform="translate(40,250)">
      <text x="0" y="0" font-size="11" font-style="italic" fill="#475569">✅ 콘솔에 다음이 보이면 성공:</text>
      <text x="0" y="22" font-size="11" font-family="monospace" fill="#10b981">  [beacon-edge] 서버 시작 — http://0.0.0.0:8088</text>
    </g>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(50,800)">
    <rect width="1300" height="240" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="1300" height="50" rx="14" fill="#3b82f6"/>
    <text x="20" y="33" font-size="18" font-weight="900" fill="#fff">STEP 2 · 서버 IP 확인 + 동작 검증</text>

    <g transform="translate(40,70)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#0f172a">🔍 서버 PC의 IP 주소 찾기:</text>

      <rect x="0" y="35" width="600" height="130" rx="8" fill="#0f172a"/>
      <text x="20" y="60" font-size="11" fill="#86efac" font-family="monospace">Windows:</text>
      <text x="20" y="80" font-size="12" fill="#fff" font-family="monospace">  ipconfig | findstr IPv4</text>
      <text x="20" y="110" font-size="11" fill="#86efac" font-family="monospace">Linux/Mac:</text>
      <text x="20" y="130" font-size="12" fill="#fff" font-family="monospace">  hostname -I</text>
      <text x="20" y="155" font-size="11" fill="#fde68a" font-family="monospace">  → 예: 192.168.0.50</text>

      <text x="630" y="55" font-size="13" font-weight="800" fill="#0f172a">🧪 검증 테스트:</text>
      <rect x="630" y="65" width="590" height="100" rx="8" fill="#1e293b"/>
      <text x="650" y="88" font-size="11" fill="#86efac" font-family="monospace"># 헬스체크</text>
      <text x="650" y="108" font-size="11" fill="#fff" font-family="monospace">curl http://localhost:8088/health</text>
      <text x="650" y="128" font-size="11" fill="#fde68a" font-family="monospace">  → {"status":"ok"}</text>
      <text x="650" y="152" font-size="10" fill="#cbd5e1" font-family="monospace">  브라우저: http://localhost:8088/dashboard</text>
    </g>

    <g transform="translate(40,200)">
      <text x="0" y="20" font-size="11" font-style="italic" fill="#475569">💡 게이트웨이가 보낼 주소 (이 IP를 기억!): http://192.168.0.50:8088/api/beacon/log</text>
    </g>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(50,1070)">
    <rect width="1300" height="400" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="1300" height="50" rx="14" fill="#7c3aed"/>
    <text x="20" y="33" font-size="18" font-weight="900" fill="#fff">STEP 3 · Minew G1 게이트웨이 설정 (2분)</text>

    <g transform="translate(40,70)">
      <rect width="600" height="300" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#5b21b6">🥇 방법 A: TagCloud 경유 (쉬움)</text>
      <text x="20" y="55" font-size="11" fill="#0f172a">1️⃣  tagcloud.minew.com 로그인</text>
      <text x="20" y="80" font-size="11" fill="#0f172a">2️⃣  Devices → 게이트웨이 클릭</text>
      <text x="20" y="105" font-size="11" fill="#0f172a">3️⃣  Data Forwarding / Webhook 메뉴</text>
      <text x="20" y="130" font-size="11" fill="#0f172a">4️⃣  + Add Webhook</text>
      <text x="20" y="155" font-size="11" fill="#0f172a">5️⃣  입력:</text>
      <rect x="40" y="170" width="540" height="80" rx="6" fill="#fff" stroke="#c4b5fd"/>
      <text x="55" y="190" font-size="10" fill="#5b21b6" font-family="monospace">URL:</text>
      <text x="55" y="208" font-size="11" fill="#0f172a" font-family="monospace" font-weight="900">http://192.168.0.50:8088/api/beacon/log</text>
      <text x="55" y="228" font-size="10" fill="#5b21b6" font-family="monospace">Method: POST · Type: application/json · Auth: 비움</text>
      <text x="55" y="245" font-size="9" fill="#a78bfa">      ↑ 본인 서버 IP로 변경</text>
      <text x="20" y="275" font-size="11" fill="#0f172a">6️⃣  Save → 1분 내 데이터 수신 시작</text>
    </g>

    <g transform="translate(660,70)">
      <rect width="600" height="300" rx="10" fill="#fef3c7" stroke="#fde68a"/>
      <text x="20" y="28" font-size="14" font-weight="900" fill="#92400e">🥈 방법 B: 게이트웨이 직접 접속</text>
      <text x="20" y="55" font-size="11" fill="#0f172a">1️⃣  라우터에서 G1 IP 찾기 (예: 192.168.0.100)</text>
      <text x="20" y="80" font-size="11" fill="#0f172a">2️⃣  브라우저: http://192.168.0.100</text>
      <text x="20" y="105" font-size="11" fill="#0f172a">3️⃣  로그인: admin / minew123</text>
      <text x="20" y="130" font-size="11" fill="#0f172a">4️⃣  Application Mode → HTTP Push</text>
      <text x="20" y="155" font-size="11" fill="#0f172a">5️⃣  URL 입력:</text>
      <rect x="40" y="170" width="540" height="60" rx="6" fill="#fff" stroke="#fde68a"/>
      <text x="55" y="195" font-size="11" fill="#0f172a" font-family="monospace" font-weight="900">http://192.168.0.50:8088/api/beacon/log</text>
      <text x="55" y="215" font-size="9" fill="#92400e">      ↑ 본인 엣지 서버 IP</text>
      <text x="20" y="250" font-size="11" fill="#0f172a">6️⃣  Save → 게이트웨이 자동 재부팅 (1분)</text>
      <text x="20" y="275" font-size="10" fill="#92400e">💡 TagCloud는 그대로 작동, 이중 모니터링</text>
    </g>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(50,1500)">
    <rect width="1300" height="280" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="1300" height="50" rx="14" fill="#dc2626"/>
    <text x="20" y="33" font-size="18" font-weight="900" fill="#fff">STEP 4 · 동작 확인</text>

    <g transform="translate(40,70)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#0f172a">✅ 서버 콘솔에 다음 줄이 나오면 성공:</text>
      <rect x="0" y="35" width="1220" height="60" rx="6" fill="#0f172a"/>
      <text x="20" y="75" font-size="13" fill="#86efac" font-family="monospace">[수신] gw=AC233F123456 mac=AA:BB:CC:11:22:33 maj/min=1/1 rssi=-65.0 ip=192.168.0.100</text>

      <text x="0" y="125" font-size="13" font-weight="800" fill="#0f172a">📊 대시보드 확인 (http://localhost:8088/dashboard):</text>
      <g transform="translate(0,140)">
        <rect width="280" height="100" rx="8" fill="#dcfce7" stroke="#86efac"/>
        <text x="140" y="30" text-anchor="middle" font-size="11" fill="#065f46">서버 상태</text>
        <text x="140" y="60" text-anchor="middle" font-size="20" font-weight="900" fill="#10b981">✓ ok</text>

        <rect x="295" y="0" width="280" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="435" y="30" text-anchor="middle" font-size="11" fill="#1e3a8a">SSE 연결</text>
        <text x="435" y="60" text-anchor="middle" font-size="14" font-weight="900" fill="#3b82f6">🟢 연결됨</text>

        <rect x="590" y="0" width="280" height="100" rx="8" fill="#fef3c7" stroke="#fde68a"/>
        <text x="730" y="30" text-anchor="middle" font-size="11" fill="#92400e">총 수신 로그</text>
        <text x="730" y="60" text-anchor="middle" font-size="24" font-weight="900" fill="#f59e0b">142</text>

        <rect x="885" y="0" width="335" height="100" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
        <text x="1052" y="30" text-anchor="middle" font-size="11" fill="#5b21b6">활성 비콘 / 게이트웨이</text>
        <text x="1052" y="60" text-anchor="middle" font-size="20" font-weight="900" fill="#7c3aed">3 / 1</text>
      </g>
    </g>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(50,1810)">
    <rect width="1300" height="350" rx="14" fill="#fff" filter="url(#sh)"/>
    <rect x="0" y="0" width="1300" height="50" rx="14" fill="#f59e0b"/>
    <text x="20" y="33" font-size="18" font-weight="900" fill="#fff">STEP 5 · 비콘 → 위치/직원 매핑 (서버 재시작 불필요)</text>

    <g transform="translate(40,70)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#0f172a">📝 beacon-edge-server/config/beacon_map.json 편집:</text>

      <rect x="0" y="35" width="1220" height="240" rx="8" fill="#0f172a"/>
      <text x="20" y="60" font-size="12" fill="#fde68a" font-family="monospace">{</text>
      <text x="40" y="80" font-size="11" fill="#86efac" font-family="monospace">"locations": [</text>
      <text x="60" y="100" font-size="11" fill="#fff" font-family="monospace">{ "major": 1, "minor": 1, "name": "전시실 1" },</text>
      <text x="60" y="118" font-size="11" fill="#fff" font-family="monospace">{ "major": 1, "minor": 2, "name": "전시실 2" },</text>
      <text x="60" y="136" font-size="11" fill="#fff" font-family="monospace">{ "major": 1, "minor": 3, "name": "체험실" },</text>
      <text x="60" y="154" font-size="11" fill="#fff" font-family="monospace">{ "major": 1, "minor": 4, "name": "매점" }</text>
      <text x="40" y="174" font-size="11" fill="#86efac" font-family="monospace">],</text>
      <text x="40" y="194" font-size="11" fill="#86efac" font-family="monospace">"staff": [</text>
      <text x="60" y="214" font-size="11" fill="#fff" font-family="monospace">{ "major": 100, "minor": 1, "name": "이경연 (시설팀)" },</text>
      <text x="60" y="232" font-size="11" fill="#fff" font-family="monospace">{ "major": 100, "minor": 2, "name": "홍예성 (기획팀)" }</text>
      <text x="40" y="252" font-size="11" fill="#86efac" font-family="monospace">]</text>
      <text x="20" y="272" font-size="12" fill="#fde68a" font-family="monospace">}</text>
    </g>

    <text x="40" y="332" font-size="11" font-style="italic" fill="#475569">💡 저장하면 다음 수신부터 즉시 반영 (대시보드 해석 컬럼에 노랑/보라 배지 표시)</text>
  </g>

  <!-- STEP 6 -->
  <g transform="translate(50,2190)">
    <rect width="1300" height="180" rx="14" fill="#0f172a" filter="url(#sh)"/>
    <text x="20" y="35" font-size="18" font-weight="900" fill="#fff">⚙️ 추가 옵션</text>

    <g transform="translate(20,60)">
      <rect width="410" height="100" rx="8" fill="#1e293b"/>
      <text x="20" y="28" font-size="13" font-weight="900" fill="#86efac">🔁 24/7 자동 가동</text>
      <text x="20" y="50" font-size="10" fill="#cbd5e1">Windows: schtasks /Create 등록</text>
      <text x="20" y="68" font-size="10" fill="#cbd5e1">Linux: systemd unit 파일</text>
      <text x="20" y="86" font-size="10" fill="#94a3b8">README "24/7 자동 가동" 섹션 참고</text>
    </g>

    <g transform="translate(450,60)">
      <rect width="410" height="100" rx="8" fill="#1e293b"/>
      <text x="20" y="28" font-size="13" font-weight="900" fill="#fde68a">🔥 방화벽</text>
      <text x="20" y="50" font-size="10" fill="#cbd5e1">Win: netsh advfirewall add rule</text>
      <text x="20" y="68" font-size="10" fill="#cbd5e1">       protocol=TCP localport=8088</text>
      <text x="20" y="86" font-size="10" fill="#cbd5e1">Linux: sudo ufw allow 8088/tcp</text>
    </g>

    <g transform="translate(880,60)">
