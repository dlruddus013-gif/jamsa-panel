<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0f172a">
  <!-- 캐시 무효화: 항상 최신 버전 받기 (모바일에서 옛 버전 캐싱 문제 방지) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'&gt;&lt;rect width='192' height='192' rx='28' fill='%230f172a'/&gt;&lt;text x='96' y='130' font-size='110' text-anchor='middle' fill='white'&gt;🏛️&lt;/text&gt;&lt;/svg&gt;">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob: http://localhost:* http://127.0.0.1:* http://192.168.*.*:* http://172.*.*.*:*; connect-src 'self' https: wss: ws: http://localhost:* http://127.0.0.1:* http://192.168.*.*:* http://172.*.*.*:*; font-src 'self' data: https:; frame-src 'self' https:; media-src 'self' https: blob: http://localhost:* http://127.0.0.1:*;">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='75' font-size='80' text-anchor='middle'%3E🏛️%3C/text%3E%3C/svg%3E">
  <!-- 외부 CDN preconnect — 첫 로딩 속도 향상 -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://server.arcgisonline.com">
  <link rel="dns-prefetch" href="https://tile.openstreetmap.org">
  <!-- Leaflet 미리 로드 — 위성 지도 빨리 뜨게 -->
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" crossorigin>
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin defer></script>
  <!-- bundle preload -->
  <link rel="modulepreload" href="/app.bundle.js?v=59f895a6" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; background: #f5f5f5; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* 모바일 터치 최적화 */
    button, [role="button"], input, select { touch-action: manipulation; }
    /* iOS 입력 시 자동 줌 방지 */
    @media (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; }
    }

    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; z-index: 9999; }
    #loading.hidden { display: none; }
    #loading .logo { font-size: 64px; }
    #loading .title { font-size: 18px; font-weight: 700; }
    #loading .sub { font-size: 12px; opacity: 0.6; }
    #loading .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-stack { position: fixed; bottom: 12px; right: 12px; z-index: 9000; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .status-pill { padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 600; background: rgba(15, 23, 42, 0.85); color: #fff; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .status-pill[data-state="online"] .dot, .status-pill[data-state="ok"] .dot, .status-pill[data-state="idle"] .dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-pill[data-state="offline"] .dot, .status-pill[data-state="error"] .dot { background: #ef4444; }
    .status-pill[data-state="pending"] .dot, .status-pill[data-state="syncing"] .dot { background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes pulseSync { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); } 50% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } }

    /* 로딩 중에는 검색창/상태 모두 숨김 — React 앱 마운트 후에만 표시 */
    body.loading #globalSearch,
    body.loading .status-stack { display: none !important; }

    #globalSearch { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 8500; width: 360px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: flex; align-items: center; padding: 4px 4px 4px 14px; transition: all 0.2s; }
    #globalSearch:focus-within { width: 480px; box-shadow: 0 6px 20px rgba(59,91,219,0.18); }
    #globalSearch input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; padding: 7px 0; color: #0f172a; font-family: inherit; }
    #globalSearch input::placeholder { color: #94a3b8; }
    #globalSearch .icon { width: 14px; height: 14px; opacity: 0.5; margin-right: 8px; }
    #globalSearch .shortcut { font-size: 10px; color: #64748b; padding: 2px 6px; background: rgba(0,0,0,0.05); border-radius: 4px; margin-right: 6px; font-family: ui-monospace, monospace; }

    #searchResults { position: fixed; top: 104px; left: 50%; transform: translateX(-50%); z-index: 9500; width: 540px; max-height: 60vh; overflow: auto; background: white; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); display: none; padding: 8px; pointer-events: auto; }
    #searchResults.active { display: block; pointer-events: auto; }
    .sr-row { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .sr-row:hover { background: #f1f5f9; }
    .sr-coll { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: #dbeafe; color: #1e40af; font-weight: 600; flex-shrink: 0; min-width: 80px; text-align: center; }
    .sr-preview { font-size: 13px; color: #0f172a; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sr-empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
    .sr-header { padding: 8px 12px; font-size: 11px; color: #64748b; font-weight: 600; border-bottom: 0.5px solid #e2e8f0; margin-bottom: 4px; }

    /* ════════════════════════════════════════════
       📱 모바일 최적화 (≤ 768px)
       ════════════════════════════════════════════ */
    @media (max-width: 768px) {
      html, body { overflow: hidden auto !important; }
      body { -webkit-overflow-scrolling: touch; }

      /* 검색바: 화면 폭에 맞춤 */
      #globalSearch {
        width: calc(100vw - 16px) !important;
        max-width: calc(100vw - 16px) !important;
        top: 8px !important;
        transform: translateX(-50%) !important;
        font-size: 14px;
      }
      #globalSearch:focus-within { width: calc(100vw - 16px) !important; }
      #searchResults {
        width: calc(100vw - 16px) !important;
        max-height: 70vh !important;
      }

      /* 상태 배지: 화면 하단 우측 작게 */
      .status-stack { bottom: 6px !important; right: 6px !important; gap: 3px; }
      .status-pill { font-size: 10px; padding: 3px 7px; }

      /* React 메인 영역: 가로 스크롤 절대 금지 */
      #root, #root > * { overflow-x: hidden !important; max-width: 100vw !important; }

      /* 상단 메뉴 nav 버튼들: 가로 wrap + 충분한 터치 영역 */
      [data-jamsa-module] { min-height: 44px !important; min-width: 60px !important; padding: 8px 10px !important; font-size: 13px !important; flex-shrink: 0; }

      /* 모든 button/a 터치 영역 최소 보장 */
      button, a { min-height: 36px; }
      button[disabled] { min-height: 28px; }

      /* 작은 텍스트 키움 (가독성) */
      [style*="font-size:10px"], [style*="font-size: 10px"],
      [style*="font-size:11px"], [style*="font-size: 11px"] {
        font-size: 12px !important;
      }

      /* 카드/패널 padding 보정 */
      [style*="padding:14px"], [style*="padding: 14px"] { padding: 10px !important; }
      [style*="padding:20px"], [style*="padding: 20px"] { padding: 12px !important; }

      /* 격자 레이아웃: 좁은 화면에서 1열로 */
      [style*="grid-template-columns: 1fr 320px"],
      [style*="grid-template-columns:1fr 320px"] {
        grid-template-columns: 1fr !important;
      }

      /* 📍 모바일에서 스크롤이 자연스럽게 — 페이지가 컨텐츠만큼 길어지게 */
      html, body {
        height: auto !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        position: static !important;
      }
      #root {
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
      }
      /* 통합지도 대시보드: 컨텐츠 따라 늘어남 (height:100% 제거) */
      [data-jamsa-module-wrapper="home"] {
        height: auto !important;
        min-height: 100vh !important;
        padding-bottom: 80px !important;
      }
      /* 통합지도 자체: 화면 절반 정도 크기 — 위/아래 영역 확보 */
      [data-jamsa-map-wrapper] {
        height: 55vh !important;
        min-height: 360px !important;
        max-height: none !important;
        /* 지도 위에서 한손가락 세로 스와이프는 지도 패닝, 가장자리에서 페이지 스크롤 */
      }

      /* 모바일 진입 안내 배너 자동 닫기 (지도 가림) */
      #mobileGuide { font-size: 11px !important; padding: 6px 10px !important; }
      #mobileGuide .mg-btn { padding: 4px 8px !important; font-size: 10px !important; }

      /* 통합지도 상단 컨트롤 바 (지도/카드/위성/하이브리드/일반/네이버/CCTV편집 등)
         가로 wrap + 스크롤 가능하게 */
      [data-jamsa-map-controls] {
        flex-wrap: wrap !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        gap: 4px !important;
      }
      [data-jamsa-map-controls] > button {
        flex-shrink: 0 !important;
        font-size: 11px !important;
        padding: 6px 8px !important;
      }
    }

    /* 모바일 진입 안내 배너 */
    #mobileGuide {
      position: fixed; top: 0; left: 0; right: 0; z-index: 12000;
      background: linear-gradient(135deg, #10b981, #0891b2);
      color: #fff; padding: 10px 14px;
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      font-size: 12px;
      animation: mgSlide 0.3s ease-out;
    }
    @keyframes mgSlide { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    #mobileGuide .mg-text { flex: 1; line-height: 1.4; }
    #mobileGuide .mg-text b { display: block; font-size: 13px; margin-bottom: 2px; }
    #mobileGuide .mg-btn {
      padding: 7px 12px; background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.45); color: #fff; border-radius: 6px;
      font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    #mobileGuide .mg-close {
      width: 28px; height: 28px; border: none; background: rgba(0,0,0,0.2);
      color: #fff; border-radius: 50%; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body class="loading">
  <div id="loading">
    <div class="logo">🏛️</div>
    <div class="title">한국잠사박물관 통합관리 시스템</div>
    <div class="spinner"></div>
    <div class="sub" id="loadingMsg">시스템 초기화 중...</div>
  </div>

  <!-- 📱 모바일 진입 안내 배너 (좁은 화면에서만 표시) -->
  <div id="mobileGuide">
    <div class="mg-text">
      <b>📱 모바일에서는 출퇴근 전용이 편해요</b>
      <span>본인 출퇴근만 하실 거면 한 번에 가능합니다</span>
    </div>
    <button class="mg-btn" onclick="location.href='/staff-checkin'">출퇴근 페이지로</button>
    <button class="mg-close" onclick="document.getElementById('mobileGuide').style.display='none';try{localStorage.setItem('jamsa_mobile_guide_dismissed','1')}catch(e){}">×</button>
  </div>

  <div id="globalSearch">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="재고/시설/조치/이력 전체 검색... (Ctrl+K, 이미지는 붙여넣기/드래그 가능)" autocomplete="off">
    <button id="imgAttachBtn" title="이미지 첨부 (Ctrl+V로 붙여넣기도 가능)" style="background:transparent;border:0;cursor:pointer;font-size:18px;color:#6366f1;padding:0 6px" onclick="document.getElementById('imgPicker').click()">📷</button>
    <input id="imgPicker" type="file" accept="image/*" multiple style="display:none">
    <span class="shortcut">⌘K</span>
  </div>
  <div id="attachedImagesPreview" style="display:none;padding:6px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0;gap:6px;flex-wrap:wrap;border-radius:8px;margin:4px 0"></div>
  <div id="searchResults"></div>

  <div id="root"></div>

  <!-- ☁️ 클라우드 동기화 플로팅 버튼 (항상 잘 보이는 위치) -->
  <button id="syncFab" type="button" title="클라우드 동기화 / 다른 기기와 데이터 맞추기" style="
    position:fixed; bottom:64px; right:14px; z-index:9500;
    width:54px; height:54px; border-radius:50%; border:none;
    background:linear-gradient(135deg,#7c3aed,#0891b2); color:#fff;
    box-shadow:0 6px 20px rgba(124,58,237,0.5), 0 0 0 0 rgba(124,58,237,0.4);
    font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    animation: syncFabPulse 2.5s ease-in-out infinite;
  ">☁️</button>
  <style>
    @keyframes syncFabPulse { 0%, 100% { box-shadow: 0 6px 20px rgba(124,58,237,0.5), 0 0 0 0 rgba(124,58,237,0.4); } 50% { box-shadow: 0 6px 20px rgba(124,58,237,0.5), 0 0 0 12px rgba(124,58,237,0); } }
    #syncFab:hover { transform: scale(1.08); }
    #syncFab[data-state="error"] { background: linear-gradient(135deg,#dc2626,#ea580c); animation: syncFabPulse 1s ease-in-out infinite; }
    #syncFab[data-state="syncing"], #syncFab[data-state="pending"] { background: linear-gradient(135deg,#fbbf24,#f59e0b); }
    @media (max-width: 768px) {
      #syncFab { bottom: 80px !important; right: 10px !important; width: 48px !important; height: 48px !important; font-size: 20px !important; }
    }
  </style>

  <div class="status-stack">
    <div class="status-pill" id="authBadge" data-state="offline" title="인증 상태">
      <span class="dot"></span>
      <span class="auth-txt">🔓 미로그인</span>
    </div>
    <div class="status-pill" id="syncBadge" data-state="idle" title="클릭하여 동기화 상태 보기" style="cursor:pointer;">
      <span class="dot"></span>
      <span class="sync-txt">클라우드 ✓</span>
    </div>
    <div class="status-pill" id="backendBadge" data-state="offline" title="CCTV 5555 (옵션)" style="display:none;">
      <span class="dot"></span>
      <span id="backendStatus">CCTV 확인...</span>
    </div>
  </div>

  <!-- 클라우드 동기화 진단/제어 모달 -->
  <div id="syncDiagModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:11000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:#0f172a;color:#f1f5f9;border-radius:12px;width:100%;max-width:480px;max-height:85vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div style="font-size:15px;font-weight:800;">☁️ 클라우드 동기화</div>
        <button id="syncDiagClose" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#94a3b8;border-radius:6px;padding:4px 10px;cursor:pointer;">✕</button>
      </div>
      <div id="syncDiagBody" style="font-size:12px;line-height:1.7;">데이터 로딩 중...</div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
        <button id="syncDiagRefresh" style="flex:1;min-width:120px;padding:10px;background:#1e40af;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">🔄 상태 새로고침</button>
        <button id="syncDiagPush" style="flex:1;min-width:120px;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">⬆ 로컬→클라우드 강제 푸시</button>
        <button id="syncDiagPull" style="flex:1;min-width:120px;padding:10px;background:#059669;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">⬇ 클라우드→로컬 강제 동기화</button>
      </div>
      <div style="margin-top:10px;font-size:10px;color:#64748b;line-height:1.5;">
        💡 다른 기기에서 변경한 내용이 안 보이면 <strong>⬇ 강제 동기화</strong> 후 새로고침.<br>
        💡 이 기기 변경이 다른 기기에 안 가면 <strong>⬆ 강제 푸시</strong>.
      </div>
    </div>
  </div>

  <script>
    // 📱 모바일 진입 시 안내 배너 표시 (한 번 닫으면 다시 안 뜸)
    (function() {
      try {
        const isMobile = window.innerWidth <= 768 || /iPhone|Android.*Mobile|iPad/.test(navigator.userAgent);
        const dismissed = localStorage.getItem('jamsa_mobile_guide_dismissed') === '1';
        if (isMobile && !dismissed) {
          const g = document.getElementById('mobileGuide');
          if (g) g.style.display = 'flex';
        }
      } catch (e) {}
    })();

    (function() {
      const msgs = ['시스템 초기화 중...', '인증 확인...', '데이터 동기화...', '거의 완료...'];
      let i = 0;
      const msgEl = document.getElementById('loadingMsg');
      const interval = setInterval(() => {
        i = (i + 1) % msgs.length;
        if (msgEl && !msgEl.textContent.includes('완료') && !msgEl.textContent.includes('필요') && !msgEl.textContent.includes('실패')) {
          msgEl.textContent = msgs[i];
        }
      }, 700);
      window.__hideLoading = () => {
        clearInterval(interval);

      const compressImage = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const tryCompress = (maxDim, quality) => {
              let w = img.width, h = img.height;
              if (Math.max(w, h) > maxDim) {
                const ratio = maxDim / Math.max(w, h);
                w = Math.round(w * ratio); h = Math.round(h * ratio);
              }
              const c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              return c.toDataURL('image/jpeg', quality);
            };
            // 1차: 1280px @ 0.85 → 2차: 1024 @ 0.75 → 3차: 800 @ 0.7
            const targets = [[1280,0.85],[1024,0.75],[800,0.70],[640,0.65]];
            let result = null;
            for (const [d,q] of targets) {
              result = tryCompress(d, q);
              // base64 size 추정 (4/3 overhead)
              if (result.length < 1.2 * 1024 * 1024) break;
            }
            resolve(result);
          };
          img.onerror = reject;
          img.src = reader.result;

      const SEARCH_KEYS = Object.keys(LABELS);
      const clientSideSearch = (q, limit = 30) => {
        const lower = q.toLowerCase();
        const matches = [];
        for (const key of SEARCH_KEYS) {
          let arr;
          try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { continue; }
          if (!Array.isArray(arr)) continue;
          arr.forEach((item, idx) => {
            const text = JSON.stringify(item).toLowerCase();
            if (text.includes(lower)) {
              const preview = JSON.stringify(item).replace(/[{}"]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
              matches.push({ collection: key, index: idx, item, preview });
            }
          });
        }
        return matches.slice(0, limit);
      };
      const renderSearchMatches = (q, matches, mode) => {
        const grouped = {};
        matches.forEach(m => { (grouped[m.collection] = grouped[m.collection] || []).push(m); });
        const modeBadge = mode === 'client'
          ? '<span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">📱 로컬</span>'
          : '<span style="background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:bold">☁ 서버</span>';
        let html = '<div class="sr-header" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>' + matches.length + '건 ' + modeBadge + '</span><button data-search-action="ask-chatbot" onclick="window.__askChatbot()" style="background:linear-gradient(90deg,#9333ea,#10b981);color:#fff;border:0;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:bold;cursor:pointer">🤖 AI에게 물어보기</button></div>';
        for (const [coll, items] of Object.entries(grouped)) {
          const label = LABELS[coll] || coll.replace('jamsa_', '');
          items.slice(0, 6).forEach(m => {
            const e = (m.preview || '').replace(/</g, '&lt;');
            html += '<div class="sr-row" onclick="window.__openItem(\'' + coll + '\',' + m.index + ')"><span class="sr-coll">' + label + '</span><span class="sr-preview">' + e + '</span></div>';
          });
          if (items.length > 6) html += '<div class="sr-row" style="opacity:0.6"><span class="sr-coll">' + label + '</span><span class="sr-preview">...외 ' + (items.length - 6) + '건</span></div>';
        }
        results.innerHTML = html;
        results.classList.add('active');
      };

      // 🆕 자연어 질문 패턴 — 이게 매칭되면 단순 검색이 아닌 AI 질문으로 자동 처리
      const looksLikeNLQuestion = (q) => {
        if (!q || q.length < 3) return false;
        if (/\?$|？$/.test(q)) return true;  // 끝에 물음표
        if (q.length >= 12) return true;  // 12자 이상은 거의 자연어 문장
        // 의문/요청/문제해결 키워드
        return /(어떻게|어디서?|언제|왜|뭐가|무엇|방법|도와줘|해줘|해결|문제|안돼|안 돼|고장|오류|에러|어렵|알려줘|보여줘|추천|선택|결정|판단|차이|비교|분석|평가|만들어|등록 안|연결 안)/.test(q);
      };

      const search = async (q) => {
        if (!q) { renderEmpty(); return; }
        // 명시적 AI 트리거 (?/  접두사) — 그대로 유지
        if (q.startsWith('?') || q.startsWith('/')) {
          const question = q.slice(1).trim();
          if (!question) {
            results.innerHTML = '<div class="sr-empty">물음표 뒤에 질문을 입력하세요. 예: <strong>?재고 추가</strong></div>';
            results.classList.add('active');
            return;
          }
          askChatbot(question);
          return;
        }
        // 🆕 자연어 질문은 검색 대신 바로 AI에게 (단순 단어/이름 검색은 그대로 검색)
        if (looksLikeNLQuestion(q)) {
          saveHistory(q);
          askChatbot(q);
          return;
        }
        // 1) 서버 검색 시도 (인증 있을 때) → 실패하면 클라이언트 검색 자동 폴백
        let serverOk = false;
        if (window.authFetch) {
          try {
            const res = await window.authFetch('/api/search?q=' + encodeURIComponent(q) + '&limit=30');
            if (res.ok) {
              const data = await res.json();
              const matches = data.matches || [];
              saveHistory(q);
              if (matches.length === 0) {
                // 🆕 검색 결과 0건이면 자동으로 AI 호출
                askChatbot(q);
                return;
              }
              renderSearchMatches(q, matches, 'server');
              serverOk = true;
              return;
            }
          } catch (e) { /* fallthrough */ }
        }
        // 2) 클라이언트 측 localStorage 검색 (서버 실패 또는 미인증 시)
        const matches = clientSideSearch(q, 30);
        saveHistory(q);
        if (matches.length === 0) {
          // 🆕 결과 없으면 자동으로 AI 호출
          askChatbot(q);
          return;
        }
        // 🆕 결과 있어도 상단에 "AI에게 물어보기" 큰 버튼 추가는 renderSearchMatches에서 처리
        renderSearchMatches(q, matches, 'client');
      };
      window.__openItem = (coll, idx) => {
        results.classList.remove('active'); input.value = '';
        try {
          const data = JSON.parse(localStorage.getItem(coll) || '[]');
          const item = Array.isArray(data) ? data[idx] : data[idx];
          alert('[' + coll + ' #' + idx + ']\n\n' + JSON.stringify(item, null, 2).slice(0, 600));
        } catch (e) { alert(e.message); }
      };
      input.addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value.trim()), 200); });
      input.addEventListener('focus', () => { if (!input.value.trim()) renderEmpty(); });
      input.addEventListener('click', () => { if (!input.value.trim()) renderEmpty(); });
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { input.value = ''; results.classList.remove('active'); input.blur(); }
        if (e.key === 'Enter') { clearTimeout(timer); search(input.value.trim()); }
      });
      results.addEventListener('pointerdown', e => {
        const action = e.target.closest('[data-search-action]')?.dataset.searchAction;
        if (!action) return;
        e.preventDefault();
        e.stopPropagation();
        if (action === 'ask-chatbot') window.__askChatbot();
        if (action === 'new-question') { input.value = ''; input.focus(); renderEmpty(); }
      });
      results.addEventListener('click', e => {
        if (e.target.closest('[data-search-action]')) e.stopPropagation();
      });
      document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); input.focus(); input.select(); } });
      document.addEventListener('click', e => { if (!e.target.closest('#globalSearch') && !e.target.closest('#searchResults')) results.classList.remove('active'); });
    })();
  </script>
  <script>
    // Service Worker가 옛 버전을 캐싱하고 있으면 자동 정리 (모바일 캐시 문제 해결)
    (function clearOldCache() {
      // 우리 jamsa-sw 등록
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(reg => {
            if (!reg.active || !reg.active.scriptURL.includes('jamsa-sw')) {
              reg.unregister().catch(() => {});
            }
          });
        }).catch(() => {});
        // 새 SW 등록 + 업데이트 발생 시 자동 reload (옛 캐시 즉시 폐기)
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/jamsa-sw.js', { scope: '/' }).catch(() => {});
        });
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'SW_UPDATED') {
            try { sessionStorage.setItem('jamsa_sw_updated', e.data.version || '1'); } catch (_) {}
            location.reload();
          }
        });
      }
      // CacheStorage 정리
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => {
            if (name.startsWith('jamsa-old') || name.includes('workbox-precache-v1') || (name.startsWith('jamsa-v') && name !== 'jamsa-v2-2026-05-01')) {
              caches.delete(name).catch(() => {});
            }
          });
        }).catch(() => {});
      }
    })();

    // URL 파라미터 감지 — 관람객 모드 / 모듈 자동 진입
    (function detectMode() {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      const mod = params.get('module');
      if (role === 'visitor') {
        try { window.localStorage.setItem('jamsa_user_role_override', 'visitor'); } catch(e) {}
      }
      if (mod) {
        try { window.localStorage.setItem('jamsa_initial_module', mod); } catch(e) {}
      }
      // PWA 설치 프롬프트 캡처
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        // React 앱에 알림
        window.dispatchEvent(new CustomEvent('jamsa-install-available'));
      });
      window.addEventListener('appinstalled', () => {
        window.__deferredInstallPrompt = null;
        try { window.localStorage.setItem('jamsa_pwa_installed', '1'); } catch(e) {}
      });
    })();

    // ── 클라우드 동기화 진단/제어 모달 ──
    (function() {
      const modal = document.getElementById('syncDiagModal');
      const body = document.getElementById('syncDiagBody');
      const badge = document.getElementById('syncBadge');
      if (!modal || !badge) return;
      const open = () => { modal.style.display = 'flex'; refresh(); };
      const close = () => { modal.style.display = 'none'; };
      badge.addEventListener('click', open);
      const fab = document.getElementById('syncFab');
      if (fab) fab.addEventListener('click', open);
      // syncBadge data-state 변경을 syncFab 로 미러링 (시각적 피드백)
      try {
        const observer = new MutationObserver(() => {
          if (fab && badge) fab.dataset.state = badge.dataset.state || 'idle';
        });
        observer.observe(badge, { attributes: true, attributeFilter: ['data-state'] });
      } catch (e) {}
      document.getElementById('syncDiagClose')?.addEventListener('click', close);
      modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
      const refresh = async () => {
        body.innerHTML = '<div style="color:#94a3b8;">진단 중...</div>';
        try {
          const diag = (typeof window.__jamsaSyncDiag === 'function') ? await window.__jamsaSyncDiag() : null;
          if (!diag) {
            body.innerHTML = '<div style="color:#fca5a5;">진단 함수를 사용할 수 없습니다 (앱이 아직 로딩 중)</div>';
            return;
          }
          // 실제 동기화 대상 키만 비교 — 세션/임시 키는 기기 전용이라 클라우드에 안 올라감
          const syncable = diag.syncableLocalKeys ?? diag.localKeys;
          const missing = (diag.missingInCloud || []).length;
          const fullySync = diag.session && missing === 0 && diag.cloudKeys >= syncable;
          const lines = [];
          lines.push(`<div>🔐 로그인: <strong style="color:${diag.session ? '#34d399' : '#f87171'}">${diag.session ? '예' : '아니오 (편집 불가)'}</strong></div>`);
          lines.push(`<div>☁️ Supabase: <strong style="color:${diag.supabase ? '#34d399' : '#f87171'}">${diag.supabase ? '연결됨' : '미연결'}</strong></div>`);
          lines.push(`<div>🔁 자동 동기화: <strong style="color:${diag.autoSync ? '#34d399' : '#fbbf24'}">${diag.autoSync ? '활성 (30초마다)' : '비활성'}</strong></div>`);
          lines.push(`<div>📦 동기화 대상 로컬 키: <strong>${syncable}</strong>개${diag.deviceOnlyKeys?.length ? ` <span style="color:#64748b;font-size:11px;">(+ 기기 전용 ${diag.deviceOnlyKeys.length}개 제외)</span>` : ''}</div>`);
          lines.push(`<div>☁️ 클라우드 키: <strong style="color:${fullySync ? '#34d399' : (missing > 0 ? '#fbbf24' : '#34d399')}">${diag.cloudKeys}</strong>개</div>`);
          if (diag.cloudError) lines.push(`<div style="color:#fca5a5;">⚠ 클라우드 응답 에러: ${diag.cloudError}</div>`);
          if (diag.error) lines.push(`<div style="color:#fca5a5;">⚠ 에러: ${diag.error}</div>`);
          if (fullySync) {
            lines.push(`<div style="margin-top:8px;padding:8px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);border-radius:6px;color:#34d399;">✓ 완전 동기화 됨. 모든 기기에서 같은 데이터를 봅니다.</div>`);
          } else if (diag.session && missing > 0) {
            const preview = (diag.missingInCloud || []).slice(0, 5).map(k => `<code style="background:rgba(255,255,255,0.05);padding:1px 4px;border-radius:2px;font-size:10px;">${k}</code>`).join(' ');
            const more = (diag.missingInCloud.length > 5) ? ` 외 ${diag.missingInCloud.length - 5}개` : '';
            lines.push(`<div style="margin-top:8px;padding:8px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:6px;color:#fbbf24;font-size:11px;">⚠ 클라우드에 없는 키 ${missing}개: ${preview}${more}<br><br><strong>⬆ 강제 푸시</strong>를 누르면 즉시 올라갑니다. 30초 후 자동 재시도도 됩니다.</div>`);
          }
          if (!diag.session) {
            lines.push(`<div style="margin-top:8px;padding:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#fca5a5;">⚠ 로그인이 필요합니다. 편집 권한이 없으면 푸시도 불가합니다. 읽기는 가능합니다.</div>`);
          }
          if (diag.session && diag.cloudKeys === 0) {
            lines.push(`<div style="margin-top:8px;padding:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#fca5a5;">⚠ 클라우드에 데이터 0건. ⬆ 강제 푸시 실패 시 백엔드(kv_store 테이블) 문제일 수 있습니다.</div>`);
          }
          body.innerHTML = lines.join('');
        } catch (e) {
          body.innerHTML = `<div style="color:#fca5a5;">진단 실패: ${e.message}</div>`;
        }
      };
      document.getElementById('syncDiagRefresh')?.addEventListener('click', refresh);
      document.getElementById('syncDiagPush')?.addEventListener('click', async () => {
        if (typeof window.__jamsaForcePushAll !== 'function') {
          alert('푸시 함수를 사용할 수 없습니다');
          return;
        }
        body.innerHTML = '<div style="color:#fbbf24;">⬆ 푸시 중...</div>';
        try {
          await window.__jamsaForcePushAll();
          await refresh();
        } catch (e) {
          body.innerHTML = `<div style="color:#fca5a5;">푸시 실패: ${e.message}</div>`;
        }
      });
      document.getElementById('syncDiagPull')?.addEventListener('click', async () => {
        body.innerHTML = '<div style="color:#fbbf24;">⬇ 클라우드에서 동기화 중...</div>';
        try {
          const r = await fetch('/api/data-bulk', { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const result = await r.json();
          const data = result.data || {};
          let loaded = 0;
          for (const [k, v] of Object.entries(data)) {
            try {
              const str = JSON.stringify(v);
              if (localStorage.getItem(k) !== str) {
                localStorage.setItem(k, str);
                loaded++;
              }
            } catch (e) {}
          }
          body.innerHTML = `<div style="color:#34d399;">✓ ${loaded}개 키 동기화 완료. 새로고침합니다...</div>`;
          setTimeout(() => location.reload(), 1200);
        } catch (e) {
          body.innerHTML = `<div style="color:#fca5a5;">동기화 실패: ${e.message}</div>`;
        }
      });
    })();
  </script>

  <script>
    // React 앱 마운트 감지 — 모바일 친화적, 다중 폴백
    (function waitForApp() {
      const startTime = Date.now();
      const root = document.getElementById('root');
      const msgEl = document.getElementById('loadingMsg');
      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      const messages = [
        { at: 0,    text: '시스템 초기화 중...' },
        { at: 1500, text: '데이터 불러오는 중...' },
        { at: 4000, text: '거의 다 됐어요...' },
        { at: 7000, text: '⏳ 잠시만 기다려주세요' },
        { at: 10000, text: '⚠️ 강제로 화면 표시합니다' },
      ];
      let msgIdx = 0;
      const msgTimer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const next = messages.find(m => m.at > 0 && elapsed >= m.at && messages.indexOf(m) > msgIdx);
        if (next && msgEl) {
          msgIdx = messages.indexOf(next);
          msgEl.textContent = next.text;
        }
      }, 500);

      let hidden = false;
      const doHide = (reason) => {
        if (hidden) return;
        hidden = true;
        clearInterval(msgTimer);
        try { console.log('[loading] hide:', reason); } catch(e) {}
        if (typeof window.__hideLoading === 'function') {
          window.__hideLoading();
        } else {
          // 폴백: __hideLoading이 정의 안 됐어도 강제로 숨김
          const el = document.getElementById('loading');
          if (el) { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 300); }
          document.body.classList.remove('loading');
        }
      };

      // 1. MutationObserver — root에 자식이 추가되면 즉시 감지 (가장 빠름)
      if (window.MutationObserver) {
        const mo = new MutationObserver(() => {
          if (root && root.children.length > 0) {
            mo.disconnect();
            doHide('MutationObserver: root 자식 감지');
          }
        });
        mo.observe(root, { childList: true });
      }

      // 2. 폴링 백업 (200ms — 모바일은 가끔 MutationObserver 누락)
      const checkTimer = setInterval(() => {
        if (root && root.children.length > 0) {
          clearInterval(checkTimer);
          doHide('폴링: root 자식 감지');
        }
      }, 200);

      // 3. 모바일은 timeout 짧게 (8초), 데스크톱은 12초 — 그 후 강제 숨김
      const TIMEOUT_MS = isMobile ? 8000 : 12000;
      setTimeout(() => {
        clearInterval(checkTimer);
        doHide(`timeout ${TIMEOUT_MS}ms`);
      }, TIMEOUT_MS);

      // 4. 추가 폴백: window.load 이벤트 후 2초
      window.addEventListener('load', () => {
        setTimeout(() => doHide('window.load + 2초'), 2000);
      });
    })();
  </script>
